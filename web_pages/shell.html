<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dell - Radio Gateway</title>
<link rel="preload" href="/pages/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/pages/common.css">
<style>
  /* Shell-local styles. Theme vars come from common.css. */
  * { margin: 0; padding: 0; }
  body { display: flex; flex-direction: column; height: 100vh; padding: 0; }

  #shell-bar {
    background: var(--t-panel);
    border-bottom: 1px solid var(--t-border);
    padding: var(--s-1) var(--s-3);
    display: flex; align-items: center; flex-wrap: wrap;
    gap: var(--s-3);
    flex-shrink: 0; min-height: 34px; z-index: 100;
  }

  /* Nav items — uppercase micro-caps, dim default, accent on hover/active */
  #shell-bar a,
  .nav-group > .nav-label {
    color: var(--t-text-dim);
    text-decoration: none;
    font-size: var(--f-md);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    padding: var(--s-1) var(--s-3);
    cursor: pointer;
    user-select: none;
    transition: color 0.1s;
  }
  #shell-bar a:hover,
  .nav-group > .nav-label:hover,
  .nav-group.open > .nav-label,
  .nav-group.has-active > .nav-label { color: var(--t-accent); text-decoration: none; }
  #shell-bar a.active { color: var(--t-accent); }

  .shell-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0; }
  .shell-nav > a + a,
  .shell-nav > a + .nav-group,
  .shell-nav > .nav-group + a,
  .shell-nav > .nav-group + .nav-group {
    border-left: 1px solid var(--t-border);
  }

  .nav-group { position: relative; }
  .nav-group > .nav-label::after {
    content: ' \25BE'; font-size: 0.7em; opacity: 0.5; margin-left: 2px;
  }
  .nav-drop {
    display: none; position: absolute; top: 100%; left: 0;
    background: var(--t-panel);
    border: 1px solid var(--t-border);
    border-top: none;
    min-width: 140px; z-index: 200;
    box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    padding: var(--s-1) 0;
  }
  .nav-group.open > .nav-drop { display: block; }
  .nav-drop a {
    display: block;
    padding: var(--s-1) var(--s-3) !important;
    border-left: none !important;
    white-space: nowrap;
    letter-spacing: 0.04em;
  }
  .nav-drop a:hover { background: var(--t-panel-hi); color: var(--t-accent); }
  .nav-drop a.active { background: var(--t-btn-active); color: var(--t-accent); }
  .nav-drop a.active::after { display: none; }

  /* Audio control cluster */
  .shell-pcm {
    display: inline-flex; gap: var(--s-1); align-items: center;
    padding-left: var(--s-3);
    border-left: 1px solid var(--t-border);
    margin-left: auto;
  }
  /* Uses .rb-caps + .rb-sm from common.css — only the min-width is shell-local. */
  .shell-pcm .rb { min-width: 56px; text-align: center; }
  .shell-pcm .rb.connecting { color: var(--t-warn); border-color: var(--t-warn); }
  .shell-pcm .rb.live { color: var(--t-err); border-color: var(--t-err); }
  /* MIC only: mic open and ready, NOT transmitting. Deliberately reads as
     an unpressed button — the red .live state is the only "on air" look. */
  .shell-pcm .rb.armed { border-color: var(--t-accent); }
  #mic-btn { touch-action: none; user-select: none; -webkit-user-select: none; }
  .shell-pcm input[type="range"] { width: 52px; height: 3px; }

  #shell-frame { flex: 1; border: none; width: 100%; background: var(--t-bg); }

  /* Level meter strip — primary signal real-estate. This is the gateway's
     vital-sign display: give it weight, inset channels, phosphor glow. */
  #shell-bars {
    background:
      linear-gradient(180deg, var(--t-panel) 0%, color-mix(in srgb, var(--t-panel) 92%, #000) 100%);
    border-top: 1px solid var(--t-border);
    border-bottom: 1px solid var(--t-border);
    padding: var(--s-2) var(--s-3);
    display: flex; flex-wrap: wrap;
    gap: var(--s-2) var(--s-4);
    align-items: center;
    flex-shrink: 0;
    min-height: 44px;
  }
  #shell-bars .sb {
    display: flex; gap: var(--s-2); align-items: center;
    white-space: nowrap;
  }
  #shell-bars .sb-label {
    color: var(--t-text-dim);
    font-size: var(--f-xs);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    /* Wide enough for the longest label ("IC7100", 6 chars) so every
       bar's track starts at the same offset — labels are right-aligned. */
    min-width: 4.5em;
    text-align: right;
    flex-shrink: 0;
  }
  #shell-bars .sb-pct {
    width: 2.8em; text-align: right;
    font-size: var(--f-xs);
    color: var(--t-text-dim);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  #shell-bars .sb-pct.ducked { color: var(--t-warn); }
  #shell-bars .sb-track {
    position: relative;
    width: 140px; height: 18px;
    background: #05080b;
    border: 1px solid var(--t-border);
    border-radius: var(--r-sm);
    flex-shrink: 0; overflow: hidden;
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,0.7),
      inset 0 -1px 0 rgba(255,255,255,0.02);
  }
  /* Zone ticks at 70% (warn onset) and 95% (ceiling) — live inside the track,
     behind the bar fill but visible through it, so you can read headroom. */
  #shell-bars .sb-track::before,
  #shell-bars .sb-track::after {
    content: '';
    position: absolute;
    top: 2px; bottom: 2px;
    width: 1px;
    pointer-events: none;
    z-index: 2;
  }
  #shell-bars .sb-track::before { left: 70%; background: var(--t-warn); opacity: 0.6; }
  #shell-bars .sb-track::after  { left: 95%; background: var(--t-err);  opacity: 0.7; }
  /* Bars use clip-path to reveal only the leftmost portion of a
     full-width gradient. With transform:scaleX (previous approach) the
     gradient got compressed into the visible portion, so yellow/red
     showed at low levels — the user-reported bug. clip-path keeps the
     gradient anchored so amber/red become visible only once the bar
     actually reaches their tick positions (70% and 95%). */
  #shell-bars .sb-bar {
    display: block;
    position: absolute;
    left: 0; width: 100%;
    height: calc(50% - 3px);
    clip-path: inset(0 100% 0 0);
    z-index: 1;
    /* No CSS transition — JS rAF tick updates clip-path every frame
       with proper attack/decay envelope, so we'd just fight ourselves. */
  }
  #shell-bars .sb-bar.sb-in         { background: linear-gradient(to right, var(--t-ok) 70%, var(--t-warn) 70%, var(--t-warn) 95%, var(--t-err) 95%); top: 2px; }
  #shell-bars .sb-bar.sb-out        { background: var(--t-err);    bottom: 2px; }
  #shell-bars .sb-bar.sb-loc        { background: var(--t-accent); bottom: 2px; }
  #shell-bars .sb-bar.sb-ducked-bar { background: var(--t-warn);   top: 2px; }
  /* Dual-lane bars: RX (green) top half, TX (red) bottom half — no pct label. */
  .sb-bar-rx, .sb-bar-tx {
    position: absolute; left: 0;
    width: 100%;
    height: calc(50% - 3px);
    clip-path: inset(0 100% 0 0);
    z-index: 1;
    /* rAF tick handles motion — see _sbUpdateDual. */
  }
  .sb-bar-rx { top: 2px;
               background: linear-gradient(to right, var(--t-ok) 70%, var(--t-warn) 70%, var(--t-warn) 95%, var(--t-err) 95%);
               color: var(--t-ok); }
  .sb-bar-tx { bottom: 2px;
               background: var(--t-err); color: var(--t-err); }

  #shell-bars .mute-ind {
    color: var(--t-err);
    font-weight: 700;
    font-size: var(--f-xs);
    letter-spacing: 0.1em;
  }

  /* Mobile: let bars scroll off screen */
  @media (max-width: 768px) {
    body { height: auto; overflow: auto; }
    #shell-bars { flex-shrink: 1; }
    #shell-frame { flex: none; height: calc(100vh - 78px); }
  }

  /* Header identity cluster — sits directly after the nav groups (left-packed),
     styled as a callsign plate. Small beacon LED (pulses green when server
     healthy), callsign in display font + phosphor, site name, local clock. */
  .id-cluster.shell-id {
    padding: 2px var(--s-3);
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    background: linear-gradient(180deg, #0a0f14 0%, #05080b 100%);
    border: 1px solid var(--t-border);
    border-radius: var(--r-sm);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.02),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }
  .id-led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--t-ok);
    flex-shrink: 0;
    animation: id-beacon 2.4s ease-in-out infinite;
  }
  .id-led.stale { background: var(--t-warn); }
  .id-led.dead  { background: var(--t-err);  animation: none; }
  @keyframes id-beacon {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }
  .id-cluster.shell-id .id-call {
    font-family: var(--font-display);
    color: var(--t-text);
    font-weight: 700;
    font-size: var(--f-md);
    letter-spacing: 0.08em;
  }
  .id-cluster.shell-id .id-site {
    color: var(--t-text);
    font-size: var(--f-base);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .id-cluster.shell-id .id-clock {
    font-family: var(--font-display);
    color: var(--t-text);
    font-size: var(--f-md);
    letter-spacing: 0.06em;
    margin-left: 0;
  }
  .id-cluster.shell-id .id-sep { color: var(--t-border-hi); }
</style>
</head><body>
<div id="shell-bar">
  <div class="shell-nav">
    <div class="id-cluster shell-id" title="Gateway identity">
      <span class="id-led" id="id-led" title="Gateway healthy"></span>
      <span class="id-call" id="id-call" style="display:none"></span>
      <span class="id-sep" id="id-call-sep" style="display:none">&middot;</span>
      <span class="id-site" id="id-site">--</span>
      <span class="id-sep">&middot;</span>
      <span class="id-clock" id="id-clock">--:--</span>
    </div>
    <div class="nav-group" onclick="toggleGroup(this)"><span class="nav-label">Dashboard</span><div class="nav-drop">
      <a href="/dashboard" target="content" onclick="setActive(this)">Overview</a>
      <a href="/dashboard/endpoints" target="content" onclick="setActive(this)">Endpoints</a>
      <a href="/dashboard/services" target="content" onclick="setActive(this)">Services</a>
      <a href="/dashboard/operate" target="content" onclick="setActive(this)">Operate</a>
    </div></div><div class="nav-group" onclick="toggleGroup(this)"><span class="nav-label">Audio</span><div class="nav-drop">
      <a href="/routing" target="content" onclick="setActive(this)">Routing</a>
      <a href="/monitor" target="content" onclick="setActive(this)">Monitor</a>
      <a href="/recordings" target="content" onclick="setActive(this)">Recordings</a>
      <a href="/recorder" target="content" onclick="setActive(this)">Loop Recorder</a>
      <a href="/transcribe" target="content" onclick="setActive(this)">Transcribe</a>
      <a href="/txlog" target="content" onclick="setActive(this)">Tx Log</a>
    </div></div><div class="nav-group" onclick="toggleGroup(this)"><span class="nav-label">Radios</span><div class="nav-drop" id="radios-drop">
      <a href="/radio" target="content" onclick="setActive(this)" id="nav-radio" style="display:none">TH-9800</a>
      <a href="/d75" target="content" onclick="setActive(this)" id="nav-d75" style="display:none">TH-D75</a>
      <a href="/ic7100" target="content" onclick="setActive(this)" id="nav-ic7100" style="display:none">IC-7100</a>
      <a href="/kv4p" target="content" onclick="setActive(this)" id="nav-kv4p" style="display:none">KV4P</a>
      <a href="/sdr" target="content" onclick="setActive(this)" id="nav-sdr" style="display:none">SDR</a>
    </div></div><div class="nav-group" onclick="toggleGroup(this)"><span class="nav-label">Data</span><div class="nav-drop">
      <a href="/gps" target="content" onclick="setActive(this)" id="nav-gps">GPS</a>
      <a href="/repeaters" target="content" onclick="setActive(this)" id="nav-repeaters">Repeaters</a>
      <a href="/aircraft" target="content" onclick="setActive(this)" id="nav-adsb">ADS-B</a>
      <a href="/packet" target="content" onclick="setActive(this)" id="nav-packet">Packet</a>
      <a href="/gdrive" target="content" onclick="setActive(this)">GDrive</a>
    </div></div><div class="nav-group" onclick="toggleGroup(this)"><span class="nav-label">System <span id="mgr-shell-dot" style="display:none;color:var(--t-err);font-size:0.65em;vertical-align:middle;">&#x25cf;</span></span><div class="nav-drop">
      <a href="/manager" target="content" onclick="setActive(this)">Manager</a>
      <a href="/grafana" target="content" onclick="setActive(this)">Metrics</a>
      <a href="/config" target="content" onclick="setActive(this)">Config</a>
      <a href="/logs" target="content" onclick="setActive(this)">Logs</a>
    </div></div>
    <span class="shell-pcm">
      <button id="play-btn" class="rb rb-caps rb-sm" onclick="toggleStream()"><span class="icon icon-play"></span> MP3</button>
      <input id="vol-slider" type="range" min="0" max="100" value="50" aria-label="MP3 stream volume" oninput="setVolume(this.value)">
      <button id="ws-btn" class="rb rb-caps rb-sm" onclick="toggleWS()"><span class="icon icon-play"></span> PCM</button>
      <input id="ws-vol" type="range" min="0" max="100" value="50" aria-label="PCM stream volume" oninput="setWSVol(this.value)">
      <button id="mic-btn" type="button" class="rb rb-caps rb-sm" title="Hold to talk (or hold Space)"><span class="icon icon-mic"></span> MIC</button>
      <button id="as1-btn" class="rb rb-caps rb-sm" onclick="toggleAsTap('usrp',this)" title="Monitor AllStar 1 in the PCM stream" style="display:none">AS1</button>
      <button id="as2-btn" class="rb rb-caps rb-sm" onclick="toggleAsTap('usrp2',this)" title="Monitor AllStar 2 in the PCM stream" style="display:none">AS2</button>
    </span>
  </div>
</div>
<div id="shell-bars"></div>
<iframe id="shell-frame" name="content" src="/dashboard"></iframe>
<script src="/pages/common.js"></script>
<script>

function setActive(el) {
  document.querySelectorAll('.shell-nav a').forEach(function(a){ a.classList.remove('active'); });
  el.classList.add('active');
  // Close all dropdowns after clicking a link
  document.querySelectorAll('.nav-group').forEach(function(g){ g.classList.remove('open'); });
}
function _syncGroupAria() {
  document.querySelectorAll('.nav-group').forEach(function(x) {
    var l = x.querySelector('.nav-label');
    if (l) l.setAttribute('aria-expanded', x.classList.contains('open') ? 'true' : 'false');
  });
}
function toggleGroup(g) {
  // If the click was on an <a> inside the dropdown, don't toggle
  if (event && event.target.tagName === 'A') return;
  var wasOpen = g.classList.contains('open');
  document.querySelectorAll('.nav-group').forEach(function(x){ x.classList.remove('open'); });
  if (!wasOpen) g.classList.add('open');
  _syncGroupAria();
}
// Close dropdowns when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.nav-group')) {
    document.querySelectorAll('.nav-group').forEach(function(g){ g.classList.remove('open'); });
    _syncGroupAria();
  }
});
// Keyboard access — the dropdown labels are spans, so give them button
// semantics: Tab reaches them, Enter/Space toggles, Escape closes.
document.querySelectorAll('.nav-group > .nav-label').forEach(function(l) {
  l.setAttribute('tabindex', '0');
  l.setAttribute('role', 'button');
  l.setAttribute('aria-haspopup', 'true');
  l.setAttribute('aria-expanded', 'false');
  l.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleGroup(l.parentElement); }
    else if (e.key === 'Escape') {
      document.querySelectorAll('.nav-group').forEach(function(g){ g.classList.remove('open'); });
      _syncGroupAria();
    }
  });
});

// Identity: site name from /sysinfo (poll slowly), local clock ticks locally.
function tickClock() {
  var d = new Date();
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('id-clock').textContent = hh+':'+mm;
}
setInterval(tickClock, 15000);
tickClock();
function loadIdentity() {
  fetch('/sysinfo').then(function(r){return r.json();}).then(function(s) {
    var name = s.gateway_name || s.hostname || '';
    if (name) document.getElementById('id-site').textContent = name;
    var call = (s.callsign || '').trim();
    var callEl = document.getElementById('id-call');
    var sepEl  = document.getElementById('id-call-sep');
    if (call) {
      callEl.textContent = call;
      callEl.style.display = '';
      sepEl.style.display = '';
    } else {
      callEl.style.display = 'none';
      sepEl.style.display = 'none';
    }
    var led = document.getElementById('id-led');
    led.classList.remove('stale','dead');
  }).catch(function(){
    var led = document.getElementById('id-led');
    led.classList.remove('stale'); led.classList.add('dead');
  });
}
setInterval(loadIdentity, 60000);
loadIdentity();
// --- MP3 stream player ---
var _audio = null;
var _playing = false;
var _streamTimer = null;
var _streamStart = 0;
function toggleStream() {
  if (_playing) { stopStream(); } else { startStream(); }
}
function startStream() {
  if (_audio) { try { _audio.onplaying = null; _audio.onerror = null; _audio.onended = null; _audio.pause(); _audio.src = ''; } catch(e){} _audio = null; }
  if (_streamTimer) { clearInterval(_streamTimer); _streamTimer = null; }

  var btn = document.getElementById('play-btn');
  _playing = true;
  btn.innerHTML = '<span class="icon icon-stop"></span> ...'; btn.classList.add('connecting'); btn.classList.remove('live');

  _audio = new Audio('/stream');
  _audio.volume = document.getElementById('vol-slider').value / 100;
  _audio.muted = _micDucked;   // as above: starting mid-over stays ducked

  _audio.onplaying = function() {
    _playing = true;
    _streamStart = Date.now();
    btn.innerHTML = '<span class="icon icon-stop"></span> 0:00'; btn.classList.remove('connecting'); btn.classList.add('live');
    _streamTimer = setInterval(function() {
      var s = Math.floor((Date.now() - _streamStart) / 1000);
      btn.innerHTML = '<span class="icon icon-stop"></span> ' + Math.floor(s/60) + ':' + (s%60<10?'0':'') + s%60;
    }, 1000);
  };

  _audio.onerror = function() {
    stopStream();
  };

  _audio.onended = function() { stopStream(); };

  _audio.play().catch(function(e) {
    stopStream();
  });
}
function stopStream() {
  if (_streamTimer) { clearInterval(_streamTimer); _streamTimer = null; }
  if (_audio) { try { _audio.pause(); _audio.src = ''; } catch(e){} _audio = null; }
  _playing = false;
  var _pb = document.getElementById('play-btn');
  _pb.innerHTML = '<span class="icon icon-play"></span> MP3';
  _pb.classList.remove('connecting', 'live');
}
function setVolume(v) {
  if (_audio) _audio.volume = v / 100;
}

// Highlight nav on iframe load
document.getElementById('shell-frame').addEventListener('load', function() {
  try {
    var path = this.contentWindow.location.pathname;
    document.querySelectorAll('.shell-nav a').forEach(function(a) {
      a.classList.toggle('active', a.getAttribute('href') === path);
    });
    // Highlight parent group label when child is active
    document.querySelectorAll('.nav-group').forEach(function(g) {
      g.classList.toggle('has-active', !!g.querySelector('a.active'));
    });
  } catch(e) {}
});

// --- Low-latency WebSocket PCM player ---
var _ws = null;
var _wsCtx = null;
var _wsGain = null;
var _wsPlaying = false;
var _wsTimer = null;
var _wsStart = 0;
var _wsBytes = 0;
var _wsWorklet = null;
var _wakeLock = null;

function toggleWS() {
  if (_wsPlaying) { stopWS(); } else { startWS(); }
}

function startWS() {
  var btn = document.getElementById('ws-btn');
  btn.innerHTML = '<span class="icon icon-stop"></span> ...';
  btn.classList.add('connecting'); btn.classList.remove('live');

  if (_wsCtx) { stopWS(); return; }

  try {
    _wsCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 48000});
  } catch(e) {
    btn.innerHTML = '<span class="icon icon-play"></span> PCM'; btn.classList.remove('connecting', 'live');
    return;
  }
  if (_wsCtx.state === 'suspended') { _wsCtx.resume(); }

  _wsGain = _wsCtx.createGain();
  _wsGain.gain.value = document.getElementById('ws-vol').value / 100;
  _wsApplyGain();   // starting the player mid-over must not un-duck it
  _wsGain.connect(_wsCtx.destination);

  // Buffer thresholds — kept here in one place so the ScriptProcessor
  // fallback (_drainPCM, below) and the AudioWorklet inline blob can't
  // drift out of sync. Editing one without the other was a real footgun.
  // All sample counts assume 48 kHz mono.
  var PCM_PREFILL = 9600;        // 200 ms head before playback starts
  var PCM_DROP_CEILING = 48000;  // drop oldest when buffer exceeds 1 s
  var PCM_DROP_TARGET = 9600;    // drain back down to this on overflow
  var PCM_BUF_MAX_CHUNKS = 20;   // receive-side hard cap (~1 s @ 50 ms/chunk)

  var _pcmBuf = [];
  var _pcmPos = 0;
  var _pcmTotal = 0;
  var _pcmReady = false;

  function _drainPCM(output) {
    var w = 0, need = output.length;
    if (!_pcmReady) {
      if (_pcmTotal < PCM_PREFILL) { for (w = 0; w < need; w++) output[w] = 0; return; }
      _pcmReady = true;
    }
    while (_pcmTotal > PCM_DROP_CEILING && _pcmBuf.length > 1) { _pcmTotal -= _pcmBuf[0].length; _pcmBuf.shift(); _pcmPos = 0; }
    while (w < need) {
      if (!_pcmBuf.length) { for (; w < need; w++) output[w] = 0; break; }
      var cur = _pcmBuf[0], avail = cur.length - _pcmPos;
      var take = Math.min(avail, need - w);
      for (var j = 0; j < take; j++) output[w++] = cur[_pcmPos++];
      if (_pcmPos >= cur.length) { _pcmTotal -= cur.length; _pcmBuf.shift(); _pcmPos = 0; }
    }
  }

  function _connectWS() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    _ws = new WebSocket(proto + '//' + location.host + '/ws_audio');
    _ws.binaryType = 'arraybuffer';
    _ws.onopen = function() {
      _wsPlaying = true;
      _wsStart = Date.now();
      _wsBytes = 0;
      if (navigator.wakeLock) { navigator.wakeLock.request('screen').then(function(wl) { _wakeLock = wl; }).catch(function(){}); }

  }
  _navShow('nav-radio', s.cat_enabled !== false);
  _navShow('nav-d75', s.d75_enabled !== false);
  _navShow('nav-ic7100', hasPlugin('ic7100'));
  _navShow('nav-kv4p', s.kv4p_enabled === true || hasPlugin('kv4p'));
  _navShow('nav-sdr', s.sdr1_enabled !== false || !!s.sdr2_enabled);
  _navShow('nav-gps', s.gps_enabled !== false);
  _navShow('nav-repeaters', s.repeater_db_enabled !== false);
  _navShow('nav-adsb', s.adsb_enabled !== false);
}

// Turn off every node tap. Called when the PCM player stops — see stopWS.
// Silent no-op when nothing is tapped, so it is safe on every stop.
function clearAsTaps() {
  ['usrp', 'usrp2'].forEach(function (pid) {
    var btn = document.getElementById(pid === 'usrp' ? 'as1-btn' : 'as2-btn');
    if (!btn || !btn.classList.contains('live')) return;   // nothing to do
    fetch('/' + pid + '/control', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'pcm_tap', on: '0'})
    }).then(function () { _refreshAsTaps(); }).catch(function () {});
  });
}

// AS1/AS2 monitor taps. These feed the node's RX audio straight into the PCM
// stream — they do NOT touch /routing, so listening never rewrites the graph.
// Both can be on at once; the tick loop mixes them like any other contributor.
function toggleAsTap(pid, btn) {
  var want = !btn.classList.contains('live');
  fetch('/' + (pid === 'usrp' ? 'usrp' : pid) + '/control', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'pcm_tap', on: want ? '1' : '0'})
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // Re-read BOTH buttons from the server rather than toggling only the one
      // clicked. The taps are mutually exclusive server-side, so enabling AS1
      // silently clears AS2 — without this the other button kept showing lit
      // until the next 15 s refresh.
      _refreshAsTaps();
      // The tap only produces sound if the PCM player is actually running.
      if (d && d.pcm_tap && !_wsPlaying) startWS();
    })
    .catch(function () { _refreshAsTaps(); });
}

// Show a button per discovered instance and reflect the server's tap state, so
// a reload does not show a tap as off while audio is still flowing.
function _refreshAsTaps() {
  [['usrp', 'as1-btn'], ['usrp2', 'as2-btn']].forEach(function (pair) {
    var btn = document.getElementById(pair[1]);
    if (!btn) return;
    fetch('/' + pair[0] + '/status')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) { btn.style.display = 'none'; return; }
        btn.style.display = '';
        btn.classList.toggle('live', !!s.pcm_tap);
      })
      .catch(function () { btn.style.display = 'none'; });
  });
}
setInterval(_refreshAsTaps, 15000);
_refreshAsTaps();

// AllStar entries come from /usrp/nodes — discovered plugin instances get
// menu items automatically instead of hardcoded "AllStar 1/2" links.
function _navRefreshAsl() {
  fetch('/usrp/nodes').then(function(r){ return r.json(); }).then(function(insts) {
    var drop = document.getElementById('radios-drop');
    if (!drop || !insts) return;
    insts.forEach(function(inst) {
      var id = 'nav-' + inst.id;
      if (!inst.enabled && !_navSeen[id]) return;
      var el = document.getElementById(id);
      // Label by INSTANCE number, not node number. Node numbers (683970 /
      // 683971) are impossible to match against the routing page, which calls
      // these ALLSTAR 1 and ALLSTAR 2. The node still shows in the tooltip.
      var instNum = inst.id.replace(/^usrp/, '') || '1';
      if (!el) {
        el = document.createElement('a');
        el.id = id;
        el.href = inst.panel_url;
        el.target = 'content';
        el.onclick = function(){ setActive(el); };
        drop.appendChild(el);
      }
      el.textContent = 'AllStar ' + instNum;
      el.title = inst.name + (inst.node && inst.node !== '0'
                   ? ' — node ' + inst.node : '');
      _navSeen[id] = true;
      el.style.display = '';
    });
  }).catch(function(){});
}
setInterval(_navRefreshAsl, 30000);
_navRefreshAsl();

// Manager alert dot — poll every 30s, light up if unread alerts
function pollManagerAlert() {
  fetch('/manager/status').then(function(r){return r.json();}).then(function(d){
    var dot = document.getElementById('mgr-shell-dot');
    if (dot) dot.style.display = d.unread_alerts ? '' : 'none';
  }).catch(function(){});
}
setInterval(pollManagerAlert, 30000);
pollManagerAlert();
</script>
