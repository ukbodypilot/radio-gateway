<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Routing</title>
<link rel="stylesheet" href="/pages/common.css">
<link rel="stylesheet" href="/pages/drawflow.min.css">
<style>
  body { padding: 0; margin: 0; overflow: hidden; }

  /* One outer size for every node — sources, busses and sinks — so the
     auto-arranged columns and rows line up (2026-11-13). 81px is what all
     three kinds measure in Chromium with the 8px vertical frame padding set
     on .drawflow-node; 240px fits the bus button row with the output socket
     clear. */
  :root { --node-h: 81px; --node-w: 240px; }   /* 240: room for the C button (2026-11-13) */
  #drawflow {
    width: 100%;
    height: calc(100vh - 40px);
    background: var(--t-bg);
  }

  /* Drawflow node base — phosphor/instrument sensibility.
     Title stripe on the left, monochrome body, readable type.
     Per-type colors are set via --node-color below. */
  .drawflow .drawflow-node {
    background: var(--t-panel);
    border: 1px solid var(--t-border);
    border-radius: var(--r-md);
    color: var(--t-text);
    min-width: 180px;
    font-family: inherit;
    font-size: var(--f-xs);
    /* Shared floor for EVERY node type so rows line up after auto-arrange.
       This used to sit only on .source/.sink, leaving bus height purely
       content-driven — so the two kinds settled at different heights and the
       columns never quite aligned. One number to tune; raising it grows all
       three together, which is the point. */
    min-height: var(--node-h);
    box-sizing: border-box;
    /* Drawflow's default is 15px all round; 30px of blank top+bottom was
       more than the title line itself. Sides stay 15px (socket clearance). */
    padding-top: 8px;
    padding-bottom: 8px;
  }
  /* Every node is the same outer size (--node-w x --node-h) so auto-arrange
     gives clean columns and rows. Bus button row H L D A | P M R + mute
     measured 217 px with padding (2026-11-13, after G, N and V went; it
     needed 290 px with them), so 224 px left the output socket clear.
     The C (compressor) button took it to 240 px, same 11 px clearance.
     Tighter vertical padding on title/box + compact proc buttons + tight mix
     row shaves ~10 px off the DFN-on bus height. */
  .drawflow .drawflow-node[class*="bus-"] .title-box { padding: 1px var(--s-2); line-height: 1.2; }
  .drawflow .drawflow-node[class*="bus-"] .box       { padding: 1px var(--s-2); }
  .drawflow .drawflow-node[class*="bus-"] .proc-btn,
  .drawflow .drawflow-node[class*="bus-"] .mute-btn {
    height: 12px; line-height: 10px;          /* -2px */
  }
  /* Bus vertical spacing. Every node is --node-h tall now (busses grow to
     it), so these gaps are for readability, not for squeezing into a height:
     4px under the title, 4px between the buttons and the mix slider. */
  .drawflow .drawflow-node[class*="bus-"] .proc-buttons { margin-top: 4px; }    /* space under the title line */
  .drawflow .drawflow-node[class*="bus-"] .level-bar    { margin-top: 2px; }    /* -1px */
  .drawflow .drawflow-node[class*="bus-"] .dfn-mix-row { padding: 0 6px 1px; margin-top: 4px; }  /* breathing room under the buttons; fits in --node-h */
  /* Source / sink nodes are naturally shorter (just mute + gain slider +
     level bar) — pad them out ~10 px so the three node types share a
     similar visual footprint on the canvas. */
  .drawflow .drawflow-node.source,
  .drawflow .drawflow-node.sink,
  .drawflow .drawflow-node[class*="bus-"] { min-width: var(--node-w); }
  .node-port { font-size: 0.78em; opacity: 0.55; margin-left: 4px; font-weight: 400; }
  .drawflow .drawflow-node.source .box,
  .drawflow .drawflow-node.sink   .box { padding: 8px var(--s-2); }
  .drawflow .drawflow-node.selected {
    background: var(--t-panel) !important;
    border-color: var(--t-accent) !important;
    box-shadow: 0 0 0 1px var(--t-accent) !important;
  }
  .drawflow .drawflow-node .title-box {
    padding: var(--s-1) var(--s-2);
    border-bottom: 1px solid var(--t-border);
    border-left: 6px solid var(--node-color, var(--t-border-hi));
    background:
      linear-gradient(90deg,
        color-mix(in srgb, var(--node-color, var(--t-border-hi)) 14%, var(--t-panel-hi)) 0%,
        var(--t-panel-hi) 60%);
    font-weight: 700;
    font-size: var(--f-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.25);
  }
  .drawflow .drawflow-node .box {
    padding: var(--s-1) var(--s-2);
    font-size: var(--f-xs);
    color: var(--t-text-dim);
  }

  /* Per-type accent color (drives title stripe + level bar) */
  .drawflow .drawflow-node.source       { --node-color: var(--t-ok); }
  .drawflow .drawflow-node.bus-listen   { --node-color: var(--t-accent); }
  .drawflow .drawflow-node.bus-solo     { --node-color: var(--t-warn); }
  .drawflow .drawflow-node.bus-duplex   { --node-color: var(--t-ok); }
  .drawflow .drawflow-node.bus-simplex  { --node-color: var(--t-err); }
  .drawflow .drawflow-node.sink         { --node-color: var(--t-text-dim); }

  /* Connections + sockets */
  /* --wire is the wire's GROUP colour (set from JS, refreshDecor);
     --wire-w tracks the live level of what feeds it (level poll). */
  .drawflow .connection .main-path {
    stroke: color-mix(in srgb, var(--wire, var(--t-border-hi)) 55%, var(--t-bg));
    stroke-width: var(--wire-w, 2px);
    transition: stroke 0.2s, stroke-width 0.15s, opacity 0.15s;
  }
  .drawflow .connection .main-path.selected {
    stroke: var(--t-accent);
  }
  /* Signal-flow animation — connections marked .flowing (set from JS when
     the source bus has a non-zero level) get a dashed stroke that slides
     along the path. Pure CSS; no layout cost. */
  @keyframes rf-flow { to { stroke-dashoffset: -24; } }
  .drawflow .connection.flowing .main-path {
    stroke: var(--wire, var(--t-ok));
    stroke-dasharray: 6 6;
    animation: rf-flow 1.2s linear infinite;
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--wire, var(--t-ok)) 60%, transparent));
  }
  /* Selected flowing connection: accent color wins (so selection is
     visible on active lines too) while keeping the dashed animation
     so activity is still indicated. */
  .drawflow .connection.flowing .main-path.selected {
    stroke: var(--t-accent);
    filter: drop-shadow(0 0 3px rgba(81,184,255,0.65));
  }
  .drawflow .drawflow-node .input,
  .drawflow .drawflow-node .output {
    background: var(--t-panel);
    border: 2px solid var(--t-border-hi);
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  /* Colour sockets by node role — source outputs glow green (RX),
     sink inputs glow red, and every bus socket (input or output, any
     type) glows cyan so the bus row reads as a unified rail. */
  .drawflow .drawflow-node.source .output { border-color: var(--t-ok); }
  .drawflow .drawflow-node.sink   .input  { border-color: var(--t-err); }
  .drawflow .drawflow-node[class*="bus-"] .input,
  .drawflow .drawflow-node[class*="bus-"] .output { border-color: var(--t-accent); }
  .drawflow .drawflow-node .input:hover,
  .drawflow .drawflow-node .output:hover {
    background: var(--t-accent);
    border-color: var(--t-accent);
    box-shadow: 0 0 6px var(--t-accent);
  }

  /* Node controls (mute + gain) */
  .node-controls {
    display: flex;
    align-items: center;
    gap: var(--s-1);
    padding: 2px 0;
  }
  .mute-btn, .proc-btn {
    height: 16px;
    min-width: 18px;
    padding: 0 3px;
    border: 1px solid var(--t-border);
    border-radius: var(--r-sm);
    background: var(--t-btn);
    color: var(--t-text-dim);
    font: inherit;
    font-size: var(--f-xs);
    font-weight: 600;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mute-btn:hover { border-color: var(--t-err); color: var(--t-err); }
  .mute-btn.muted {
    background: var(--t-err);
    color: var(--t-bg);
    border-color: var(--t-err);
  }
  .proc-btn:hover { border-color: var(--t-accent); color: var(--t-accent); }
  .proc-btn.on {
    background: var(--t-accent);
    color: var(--t-bg);
    border-color: var(--t-accent);
  }
  .proc-btn.out-btn.on {
    background: var(--t-ok);
    border-color: var(--t-ok);
  }
  .proc-sep {
    width: 1px;
    height: 12px;
    background: var(--t-border);
    margin: 0 3px;
    flex-shrink: 0;
  }

  /* Title-bar delay control. Fixed narrow slider: the old body row used
     flex:1 and grew with the node, which is what made it stupidly long. */
  .title-delay {
    float: right;                 /* the title line is inline content, not flex */
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: var(--s-2);
    text-transform: none; letter-spacing: 0;
  }
  .dfn-mix-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 1px 6px 2px;
    font-size: 10px;
    color: var(--t-fg);
  }
  .dfn-mix-row.dim-op { opacity: 0.4; }
  .dfn-mix-label {
    color: var(--t-fg-dim);
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .dfn-mix-slider {
    flex: 1 1 auto;
    min-width: 40px;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--t-panel-hi);
    border: 1px solid var(--t-border);
    border-radius: var(--r-sm);
    outline: none;
  }
  .dfn-mix-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--t-accent);
    cursor: pointer;
    border: none;
  }
  .dfn-mix-slider::-moz-range-thumb {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--t-accent);
    cursor: pointer;
    border: none;
  }
  .dfn-mix-val {
    font-variant-numeric: tabular-nums;
    font-size: 10px;
    color: var(--t-fg);
    min-width: 30px;
    text-align: right;
    flex-shrink: 0;
  }

  .gain-slider {
    width: 60px;
    flex-shrink: 0;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--t-panel-hi);
    border: 1px solid var(--t-border);
    border-radius: var(--r-sm);
    outline: none;
  }
  .gain-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--t-accent);
    cursor: pointer;
  }
  .gain-val {
    font-size: var(--f-xs);
    color: var(--t-text-dim);
    min-width: 28px;
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .proc-buttons {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-top: 2px;
  }

  /* Level bars inside nodes — compact VU-meter style matching shell bars.
     Asymmetric fill (thin line inside track) + zone ticks at 70/95%. */
  .level-bar {
    position: relative;
    height: 8px;
    background: #05080b;
    border: 1px solid var(--t-border);
    border-radius: 2px;
    margin-top: 3px;
    overflow: hidden;
    box-shadow:
      inset 0 1px 1px rgba(0,0,0,0.7),
      inset 0 -1px 0 rgba(255,255,255,0.02);
  }
  .level-bar::before,
  .level-bar::after {
    content: '';
    position: absolute;
    top: 1px; bottom: 1px;
    width: 1px;
    pointer-events: none;
    z-index: 2;
  }
  .level-bar::before { left: 70%; background: var(--t-warn); opacity: 0.6; }
  .level-bar::after  { left: 95%; background: var(--t-err);  opacity: 0.7; }
  .level-fill {
    display: block;
    height: calc(100% - 4px);
    margin: 2px 0;
    width: 100%;
    clip-path: inset(0 100% 0 0);
    background: linear-gradient(to right,
      var(--t-ok)   0%,  var(--t-ok)   70%,
      var(--t-warn) 70%, var(--t-warn) 95%,
      var(--t-err)  95%
    );
    box-shadow: 0 0 4px var(--t-ok);
    position: relative; z-index: 1;
    /* Smooth between polls so the bar glides instead of stepping. Slightly
       longer than the poll interval (33 ms) so each transition has just
       finished as the next value arrives. */
    transition: clip-path 40ms linear;
  }
  .drawflow-node.ptt-active {
    border-color: var(--t-err);
    box-shadow: 0 0 0 1px var(--t-err);
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: var(--s-2);
    padding: var(--s-2) var(--s-3);
    background: var(--t-panel);
    border-bottom: 1px solid var(--t-border);
    align-items: center;
    font-size: var(--f-sm);
    flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  .toolbar .status {
    color: var(--t-text-dim);
    font-size: var(--f-xs);
    letter-spacing: 0.04em;
  }
  .toolbar .hint {
    color: var(--t-text-mute);
    font-size: var(--f-xs);
    margin-left: var(--s-2);
  }
  /* .rb-danger / .rb-primary now live in common.css */

  /* Recording indicator — pulsing red LED to the left of the bus name */
  .rec-dot {
    display: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--t-err);
    box-shadow: 0 0 4px var(--t-err);
    margin-right: var(--s-2);
    vertical-align: middle;
    flex-shrink: 0;
  }
  .drawflow-node.recording .rec-dot {
    display: inline-block;
    animation: rec-pulse 1.4s ease-in-out infinite;
  }
  @keyframes rec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Inline bus-rename input (replaces inline cssText in JS) */
  .bus-rename-input {
    background: var(--t-bg);
    color: var(--t-text);
    border: 1px solid var(--t-accent);
    border-radius: var(--r-sm);
    padding: 1px var(--s-1);
    font: inherit;
    font-size: inherit;
  }

  /* Group bands: one faint labelled panel behind each group of buses that
     share a source or sink (see graphModel). Inside the zoom/pan canvas,
     before the wires and nodes, so it never takes a click. */
  .group-band {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    border: 1px solid color-mix(in srgb, var(--band, var(--t-border-hi)) 35%, transparent);
    background: color-mix(in srgb, var(--band, var(--t-border-hi)) 5%, transparent);
    border-radius: var(--r-md);
  }
  .group-band-label {
    position: absolute; top: 3px; left: 10px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: color-mix(in srgb, var(--band, var(--t-text-mute)) 80%, var(--t-text-mute));
    white-space: nowrap;
  }

  /* A bus with no sink is a normal end state (monitor / record / stream
     only), not a missing wire. Its output socket goes hollow and a short
     stub says where the audio does go. The socket still works: drag from
     it to add a sink. */
  .drawflow .drawflow-node.no-sink .output {
    border-style: dashed;
    border-color: var(--t-text-mute);
    background: transparent;
  }
  .dest-stub {
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%);
    padding: 1px 6px 1px 6px;
    border: 1px dashed var(--t-border-hi);
    border-radius: var(--r-sm);
    color: var(--t-text-dim);
    font-size: 10px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    pointer-events: auto;
  }
  .dest-stub::before {           /* the short line from the socket */
    content: '';
    position: absolute;
    right: 100%;
    top: 50%;
    width: 8px;
    border-top: 1px dashed var(--t-border-hi);
  }
  .dest-stub.nowhere { color: var(--t-text-mute); border-color: var(--t-border); }

  /* Unused sources/sinks folded away (toolbar "Show unused"). */
  .drawflow .drawflow-node.unused-hidden { display: none; }

  /* Hover highlight: the hovered node's whole path stays, the rest dims. */
  #drawflow.hl-mode .drawflow-node:not(.hl) { opacity: 0.28; }
  #drawflow.hl-mode .connection:not(.hl) .main-path { opacity: 0.12; }
  #drawflow.hl-mode .connection.hl .main-path {
    stroke: var(--wire, var(--t-accent));
    stroke-width: calc(var(--wire-w, 2px) + 1.5px);
  }
  #drawflow.hl-mode .group-band { opacity: 0.5; }
  .drawflow-node { transition: opacity 0.12s; }
  .rb.on { border-color: var(--t-accent); color: var(--t-accent); }

  /* Utility helpers */
  .flex-spacer { flex-grow: 1; }
  .bus-type-tag {
    color: var(--t-text-mute);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="rb rb-sm" onclick="addBusNode('listen')">+ Listen</button>
  <button class="rb rb-sm" onclick="addBusNode('solo')">+ Solo</button>
  <button class="rb rb-sm" onclick="addBusNode('duplex')">+ Duplex</button>
  <button class="rb rb-sm" onclick="addBusNode('simplex')">+ Simplex</button>
  <button class="rb rb-sm rb-danger" onclick="deleteSelected()">Delete</button>
  <span class="hint">Click a connection or node, then Delete (or right-click connection).</span>
  <span class="spacer"></span>
  <button class="rb rb-sm" id="unusedBtn" onclick="toggleUnused()" title="Sources and sinks with no wires">Show unused</button>
  <button class="rb rb-sm" onclick="autoArrange()">Auto-arrange</button>
  <button class="rb rb-sm rb-primary" onclick="saveRouting()">Save</button>
  <button class="rb rb-sm" onclick="loadRouting()">Reload</button>
  <span class="status" id="statusBar">Loading...</span>
</div>

<div id="drawflow"></div>

<script src="/pages/drawflow.min.js"></script>
<script src="/pages/dagre.min.js"></script>
<script src="/pages/common.js"></script>
<script>

var editor;
var _state = {};
var _nodeMap = {}; // id -> drawflow node id
// True while rebuildEditor() is restoring saved edges — see connectionCreated.
var _restoringGraph = false;

function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }

// Initialize Drawflow
var container = document.getElementById('drawflow');
editor = new Drawflow(container);
editor.reroute = true;
editor.start();

// Mouse-wheel: adjust gain on selected node, or zoom when nothing is selected.
container.addEventListener('wheel', function(e) {
  e.preventDefault();
  var selNode = document.querySelector('.drawflow-node.selected');
  var slider = selNode && (selNode.querySelector('.gain-slider') || selNode.querySelector('.dfn-mix-slider'));
  if (slider) {
    var isMix = slider.classList.contains('dfn-mix-slider');
    var step = (e.deltaY < 0 ? 1 : -1) * (isMix ? 0.05 : 5);
    var newVal = Math.max(Number(slider.min), Math.min(Number(slider.max), Number(slider.value) + step));
    slider.value = newVal;
    slider.dispatchEvent(new Event('input'));
  } else {
    if (e.deltaY < 0) editor.zoom_in();
    else              editor.zoom_out();
  }
}, { passive: false });

// Prevent Drawflow node drag from stealing slider/button/pill interactions.
// Capture phase + list every interactive descendant class so drawflow never
// starts a "move" gesture on them (that's the "cursor stuck in move mode"
// symptom when one of these slips through).
var _INTERACTIVE_SEL =
  '.gain-slider, .mute-btn, .proc-btn, .dfn-mix-slider, .bus-name, button, input, select, textarea';
container.addEventListener('mousedown', function(e) {
  if (e.target.closest(_INTERACTIVE_SEL)) e.stopPropagation();
}, true);
container.addEventListener('pointerdown', function(e) {
  if (e.target.closest(_INTERACTIVE_SEL)) e.stopPropagation();
}, true);
container.addEventListener('touchstart', function(e) {
  if (e.target.closest(_INTERACTIVE_SEL)) e.stopPropagation();
}, true);

// ── Graph model ─────────────────────────────────────────────────────────────
// One read of the live Drawflow graph, shared by auto-arrange, the group
// bands, wire colours, hover highlighting and the "no sink" decoration.
//
// GROUP = the buses that share a source or a sink, plus everything wired to
// them (a connected component). Kinds:
//   routed — has at least one sink
//   local  — has sources but no sink: monitor / record / stream only. That is
//            a normal state, not a missing wire: the bus still runs, meters,
//            records (R) and streams (P/M). It used to be parked on a 'nul'
//            sink (retired 2026-11-14) only so it would look finished.
//   idle   — a bus with nothing wired to it
// Sources and sinks wired to nothing are "unused" and foldable.
var RETIRED_SINKS = ['nul', 'recording'];   // mirror of routing_rules.RETIRED_SINKS
var GROUP_COLORS = ['#4fd6e6', '#e89d3c', '#b98cf0', '#5dc47a', '#f07a8a',
                    '#e8d05a', '#6aa8ff', '#4fc9a8', '#d98ad9', '#a8c060'];
var NODE_H_FALLBACK = 81;

// Display name of a source/sink node: the title text before its first child
// element (node.name is the id, e.g. 'cm5_aioc_tx').
function _titleText(el, fallback) {
  var c = el && el.querySelector('.drawflow_content_node');
  var t = c && c.firstChild && c.firstChild.nodeType === 3 ? c.firstChild.textContent.trim() : '';
  return t || fallback;
}

function graphModel() {
  var data = editor.drawflow.drawflow.Home.data;
  var info = {}, sources = [], buses = [], sinks = [];
  for (var nid in data) {
    var node = data[nid];
    var el = document.getElementById('node-' + nid);
    var busNameEl = el ? el.querySelector('.bus-name') : null;
    var cls = ' ' + (node.class || '') + ' ';
    var e = {
      nid: String(nid), el: el, id: (node.data && node.data.id) || node.name || '',
      h: (el && el.offsetHeight) || NODE_H_FALLBACK,
      w: (el && el.offsetWidth) || 240,
      name: busNameEl ? busNameEl.textContent : _titleText(el, node.name || ''),
      nbrs: [], col: 0, y: node.pos_y || 0, x: node.pos_x || 0, group: null
    };
    if (cls.indexOf(' source ') >= 0) { e.col = 0; sources.push(e); }
    else if (cls.indexOf('bus-') >= 0) { e.col = 1; buses.push(e); }
    else { e.col = 2; sinks.push(e); }
    info[e.nid] = e;
  }
  var edges = [];
  for (var nid in data) {
    var outputs = data[nid].outputs || {};
    for (var ok in outputs) {
      var conns = outputs[ok].connections || [];
      for (var j = 0; j < conns.length; j++) {
        var a = info[String(nid)], b = info[String(conns[j].node)];
        if (!a || !b || a.col === b.col) continue;
        edges.push({from: a, to: b});
        if (a.nbrs.indexOf(b) < 0) a.nbrs.push(b);
        if (b.nbrs.indexOf(a) < 0) b.nbrs.push(a);
      }
    }
  }
  var byName = function(a, b) { return a.name.localeCompare(b.name); };
  buses.sort(byName);
  var seen = {}, groups = [];
  for (var i = 0; i < buses.length; i++) {
    if (seen[buses[i].nid]) continue;
    var g = {cols: [[], [], []], kind: 'routed', color: null, label: ''};
    var stack = [buses[i]];
    seen[buses[i].nid] = true;
    while (stack.length) {
      var n = stack.pop();
      g.cols[n.col].push(n);
      n.group = g;
      for (var k = 0; k < n.nbrs.length; k++) {
        if (!seen[n.nbrs[k].nid]) { seen[n.nbrs[k].nid] = true; stack.push(n.nbrs[k]); }
      }
    }
    for (var c = 0; c < 3; c++) g.cols[c].sort(byName);
    g.kind = g.cols[2].length ? 'routed' : (g.cols[0].length ? 'local' : 'idle');
    var list = function(col, max) {
      var names = col.map(function(x) { return x.name; });
      return names.length > max ? names.slice(0, max).join(' · ') + ' +' + (names.length - max)
                                : names.join(' · ');
    };
    g.label = list(g.cols[1], 3) + (g.cols[2].length ? '  →  ' + list(g.cols[2], 2) : '');
    groups.push(g);
  }
  var size = function(g) { return g.cols[0].length + g.cols[1].length + g.cols[2].length; };
  var rank = {routed: 0, local: 1, idle: 2};
  groups.sort(function(a, b) {
    return (rank[a.kind] - rank[b.kind]) || (size(b) - size(a))
        || a.cols[1][0].name.localeCompare(b.cols[1][0].name);
  });
  for (var i = 0; i < groups.length; i++) {
    if (groups[i].kind !== 'idle') groups[i].color = GROUP_COLORS[i % GROUP_COLORS.length];
  }
  var unused = {src: [], sink: []};
  for (var i = 0; i < sources.length; i++) if (!sources[i].nbrs.length) unused.src.push(sources[i]);
  for (var i = 0; i < sinks.length; i++) if (!sinks[i].nbrs.length) unused.sink.push(sinks[i]);
  unused.src.sort(byName); unused.sink.sort(byName);
  return {info: info, edges: edges, groups: groups, unused: unused,
          sources: sources, buses: buses, sinks: sinks};
}

// Auto-arrange: sources | buses | sinks.
//  1. Each routed group is its own block, blocks stacked top to bottom
//     (biggest first), so wires from one group never cross another.
//  2. Inside a group, order comes from barycentre sweeps (each node moves to
//     the average position of its neighbours) — the standard way to remove
//     crossings in a layered graph.
//  3. The tallest column of a group is packed; the others are centred on
//     their neighbours, so a 4-input mixer sits in the middle of its inputs
//     and a single chain is one straight line.
//  4. Then the monitor/record-only buses (no sink), then idle buses, then the
//     unused sources/sinks (folded away unless "Unused" is on).
var GAP = 12, GROUP_GAP = 40, MARGIN_TOP = 30, MARGIN_X = 20, COL_GAP = 90;

function autoArrange() {
  var m = graphModel();
  var byName = function(a, b) { return a.name.localeCompare(b.name); };

  var maxW = [0, 0, 0];
  for (var nid in m.info) maxW[m.info[nid].col] = Math.max(maxW[m.info[nid].col], m.info[nid].w);
  var colX = [MARGIN_X, 0, 0];
  colX[1] = colX[0] + maxW[0] + COL_GAP;
  colX[2] = colX[1] + maxW[1] + COL_GAP;

  var order = {};
  function setOrder(list) { for (var i = 0; i < list.length; i++) order[list[i].nid] = i; }
  function sortByBary(list) {
    var bs = {};
    for (var i = 0; i < list.length; i++) {
      var n = list[i], s = 0;
      for (var k = 0; k < n.nbrs.length; k++) s += order[n.nbrs[k].nid];
      bs[n.nid] = n.nbrs.length ? s / n.nbrs.length : order[n.nid];
    }
    list.sort(function(a, b) { return (bs[a.nid] - bs[b.nid]) || byName(a, b); });
    setOrder(list);
  }
  var placed = {};
  function pack(list, top) {
    var y = top;
    for (var i = 0; i < list.length; i++) {
      list[i].y = y; placed[list[i].nid] = true; y += list[i].h + GAP;
    }
  }
  // Centre each node on its placed neighbours, keep order, no overlaps.
  function centreOn(list, top) {
    for (var i = 0; i < list.length; i++) {
      var n = list[i], s = 0, c = 0;
      for (var k = 0; k < n.nbrs.length; k++) {
        if (placed[n.nbrs[k].nid]) { s += n.nbrs[k].y + n.nbrs[k].h / 2; c++; }
      }
      n.y = c ? s / c - n.h / 2 : top;
    }
    var y = top;
    for (var i = 0; i < list.length; i++) {
      if (list[i].y < y) list[i].y = y;
      y = list[i].y + list[i].h + GAP;
      placed[list[i].nid] = true;
    }
  }
  function colHeight(list) {
    var h = 0;
    for (var i = 0; i < list.length; i++) h += list[i].h + GAP;
    return h;
  }

  var curY = MARGIN_TOP, prevKind = null;
  for (var gi = 0; gi < m.groups.length; gi++) {
    var g = m.groups[gi], cols = g.cols;
    // Local groups sit together in one band, so only a small gap between them.
    if (prevKind !== null) curY += (g.kind === prevKind && g.kind !== 'routed') ? GAP * 2 : GROUP_GAP;
    prevKind = g.kind;
    for (var c = 0; c < 3; c++) setOrder(cols[c]);
    for (var it = 0; it < 6; it++) { sortByBary(cols[0]); sortByBary(cols[2]); sortByBary(cols[1]); }
    var tall = 1;   // ties prefer the bus column
    if (colHeight(cols[0]) > colHeight(cols[tall])) tall = 0;
    if (colHeight(cols[2]) > colHeight(cols[tall])) tall = 2;
    pack(cols[tall], curY);
    if (tall !== 1) centreOn(cols[1], curY);
    if (tall !== 0) centreOn(cols[0], curY);
    if (tall !== 2) centreOn(cols[2], curY);
    var bottom = curY;
    for (var c = 0; c < 3; c++) {
      for (var i = 0; i < cols[c].length; i++) bottom = Math.max(bottom, cols[c][i].y + cols[c][i].h);
    }
    curY = bottom;
  }
  if (m.unused.src.length || m.unused.sink.length) {
    curY += GROUP_GAP;
    pack(m.unused.src, curY);
    pack(m.unused.sink, curY);
  }

  var data = editor.drawflow.drawflow.Home.data;
  for (var nid in m.info) {
    var n = m.info[nid];
    var x = Math.round(colX[n.col]), y = Math.round(n.y);
    data[nid].pos_x = x;
    data[nid].pos_y = y;
    if (n.el) { n.el.style.left = x + 'px'; n.el.style.top = y + 'px'; }
  }
  for (var nid in data) {
    try { editor.updateConnectionNodes('node-' + nid); } catch (e) {}
  }
  refreshDecor();
  setStatus('Auto-arranged — click Save to keep');
}

// ── Decoration: wire colours, group bands, no-sink stubs, unused fold ───────
var _wires = [];            // [{el, key}] for the live level poll
var _hlNid = null;          // node under the pointer (hover highlight)
var _showUnused = false;
try { _showUnused = localStorage.getItem('routing.showUnused') === '1'; } catch (e) {}

function _connEl(fromNid, toNid) {
  return document.querySelector('.connection.node_out_node-' + fromNid + '.node_in_node-' + toNid);
}

function refreshDecor() {
  if (!editor || !editor.precanvas) return;
  var m = graphModel();

  // Wires: group colour + level key for the poll.
  _wires = [];
  for (var i = 0; i < m.edges.length; i++) {
    var e = m.edges[i], el = _connEl(e.from.nid, e.to.nid);
    if (!el) continue;
    var g = e.from.group || e.to.group;
    if (g && g.color) el.style.setProperty('--wire', g.color);
    else el.style.removeProperty('--wire');
    _wires.push({el: el, key: e.from.col === 0 ? e.from.id : 'bus_' + e.from.id});
  }

  // Sinkless buses: a terminal stub saying where the audio does go.
  for (var i = 0; i < m.buses.length; i++) {
    var b = m.buses[i];
    if (!b.el) continue;
    var hasSink = b.nbrs.some(function(n) { return n.col === 2; });
    b.el.classList.toggle('no-sink', !hasSink);
    var stub = b.el.querySelector('.dest-stub');
    if (hasSink) { if (stub) stub.remove(); continue; }
    if (!stub) {
      stub = document.createElement('div');
      stub.className = 'dest-stub';
      b.el.appendChild(stub);
    }
    var on = function(k) { var x = document.getElementById('proc-' + b.id + '-' + k); return x && x.classList.contains('on'); };
    var taps = [];
    if (on('pcm')) taps.push('web');
    if (on('mp3')) taps.push('mp3');
    if (on('loop')) taps.push('rec');
    stub.classList.toggle('nowhere', !taps.length);
    stub.textContent = taps.length ? taps.join(' · ') : 'meter only';
    stub.title = taps.length
      ? 'No sink: this bus still runs. Its audio goes to: '
        + taps.map(function(t) { return {web: 'web listen (P)', mp3: 'MP3 stream (M)', rec: 'loop recorder (R)'}[t]; }).join(', ')
        + '. Drag from the socket to add a sink.'
      : 'No sink and no P/M/R: this bus only shows its level. Drag from the socket to add a sink.';
  }

  // Unused sources/sinks: fold away unless shown.
  var nUnused = m.unused.src.length + m.unused.sink.length;
  var all = m.unused.src.concat(m.unused.sink);
  for (var nid in m.info) {
    var n = m.info[nid];
    if (n.el) n.el.classList.toggle('unused-hidden', !_showUnused && all.indexOf(n) >= 0);
  }
  var btn = document.getElementById('unusedBtn');
  if (btn) {
    btn.textContent = (_showUnused ? 'Hide' : 'Show') + ' unused (' + nUnused + ')';
    btn.classList.toggle('on', _showUnused);
  }

  // Group bands, behind nodes and wires (inside the zoom/pan canvas).
  var old = editor.precanvas.querySelectorAll('.group-band');
  for (var i = 0; i < old.length; i++) old[i].remove();
  function band(nodes, label, color, extraRight) {
    var vis = nodes.filter(function(n) { return n.el && !n.el.classList.contains('unused-hidden'); });
    if (!vis.length) return;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (var i = 0; i < vis.length; i++) {
      var n = vis[i];
      x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
      x1 = Math.max(x1, n.x + n.w + (n.el.classList.contains('no-sink') ? (extraRight || 0) : 0));
      y1 = Math.max(y1, n.y + n.h);
    }
    var d = document.createElement('div');
    d.className = 'group-band';
    d.style.left = (x0 - 10) + 'px';
    d.style.top = (y0 - 22) + 'px';
    d.style.width = (x1 - x0 + 20) + 'px';
    d.style.height = (y1 - y0 + 32) + 'px';
    if (color) d.style.setProperty('--band', color);
    var lab = document.createElement('span');
    lab.className = 'group-band-label';
    lab.textContent = label;
    d.appendChild(lab);
    editor.precanvas.insertBefore(d, editor.precanvas.firstChild);
  }
  var locals = [], idles = [];
  for (var i = 0; i < m.groups.length; i++) {
    var g = m.groups[i], nodes = g.cols[0].concat(g.cols[1], g.cols[2]);
    if (g.kind === 'routed') band(nodes, g.label, g.color, 0);
    else if (g.kind === 'local') locals = locals.concat(nodes);
    else idles = idles.concat(nodes);
  }
  band(locals, 'Monitor / record only — no sink', null, 110);
  band(idles, 'Idle buses — nothing wired', null, 110);
  if (_showUnused) band(all, 'Unused', null, 0);

  applyHighlight();
}

function toggleUnused() {
  _showUnused = !_showUnused;
  try { localStorage.setItem('routing.showUnused', _showUnused ? '1' : '0'); } catch (e) {}
  refreshDecor();
}

// Hover: light up the node's whole path (source → bus → sink), dim the rest.
function applyHighlight() {
  var root = document.getElementById('drawflow');
  var hl = {};
  if (_hlNid && !editor.connection) {
    var m = graphModel(), n = m.info[_hlNid];
    if (n) {
      hl[n.nid] = true;
      var buses = n.col === 1 ? [n] : n.nbrs;   // a source/sink lights its buses...
      for (var i = 0; i < buses.length; i++) {
        hl[buses[i].nid] = true;
        if (n.col === 1) { for (var k = 0; k < n.nbrs.length; k++) hl[n.nbrs[k].nid] = true; }
        else {                                  // ...and their far side
          var far = n.col === 0 ? 2 : 0;
          for (var k = 0; k < buses[i].nbrs.length; k++) {
            if (buses[i].nbrs[k].col === far) hl[buses[i].nbrs[k].nid] = true;
          }
        }
      }
    }
  }
  var on = !!_hlNid && Object.keys(hl).length > 0;
  root.classList.toggle('hl-mode', on);
  var nodes = root.querySelectorAll('.drawflow-node');
  for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('hl', on && !!hl[nodes[i].id.replace('node-', '')]);
  var conns = root.querySelectorAll('.connection');
  for (var i = 0; i < conns.length; i++) {
    var c = conns[i], f = null, t = null;
    for (var k = 0; k < c.classList.length; k++) {
      var cl = c.classList[k];
      if (cl.indexOf('node_out_node-') === 0) f = cl.substring(14);
      else if (cl.indexOf('node_in_node-') === 0) t = cl.substring(13);
    }
    c.classList.toggle('hl', on && !!hl[f] && !!hl[t]);
  }
}
container.addEventListener('mouseover', function(e) {
  var n = e.target.closest && e.target.closest('.drawflow-node');
  var nid = n ? n.id.replace('node-', '') : null;
  if (nid !== _hlNid) { _hlNid = nid; applyHighlight(); }
});
container.addEventListener('mouseleave', function() { _hlNid = null; applyHighlight(); });

// Keep bands/colours/stubs in step with edits.
var _decorTimer = null;
function refreshDecorSoon() {
  clearTimeout(_decorTimer);
  _decorTimer = setTimeout(refreshDecor, 30);
}
['connectionCreated', 'connectionRemoved', 'nodeMoved', 'nodeRemoved'].forEach(function(ev) {
  editor.on(ev, refreshDecorSoon);
});
editor.on('mouseMove', function() { if (editor.drag) refreshDecorSoon(); });

// Delete selected connection or node
function deleteSelected() {
  // Try to find a selected connection
  var sel = document.querySelector('.main-path.selected');
  if (sel) {
    var parent = sel.closest('.connection');
    if (parent) {
      var classes = parent.classList;
      // Extract node_out, node_in, output, input from class names
      var nodeOut, nodeIn, outputClass, inputClass;
      for (var i = 0; i < classes.length; i++) {
        if (classes[i].startsWith('node_in_node-')) nodeIn = classes[i].replace('node_in_node-', '');
        if (classes[i].startsWith('node_out_node-')) nodeOut = classes[i].replace('node_out_node-', '');
        if (classes[i].startsWith('output_') && !classes[i].startsWith('node_out')) outputClass = classes[i];
        if (classes[i].startsWith('input_') && !classes[i].startsWith('node_in')) inputClass = classes[i];
      }
      if (nodeOut && nodeIn && outputClass && inputClass) {
        editor.removeSingleConnection(nodeOut, nodeIn, outputClass, inputClass);
        setStatus('Connection removed');
        return;
      }
    }
  }
  // Try selected node
  var selNode = document.querySelector('.drawflow-node.selected');
  if (selNode) {
    var nid = selNode.id.replace('node-', '');
    editor.removeNodeId('node-' + nid);
    setStatus('Node removed');
    return;
  }
  setStatus('Nothing selected — click a connection or node first');
}

// Right-click on connection to delete
container.addEventListener('contextmenu', function(e) {
  var path = e.target.closest('.connection');
  if (path) {
    e.preventDefault();
    // Select then delete
    var mainPath = path.querySelector('.main-path');
    if (mainPath) {
      // Click to select first
      mainPath.classList.add('selected');
      deleteSelected();
    }
  }
});

// Load routing state and populate nodes
function loadRouting() {
  fetch('/routing/status')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      _state = d;
      rebuildEditor();
      setStatus('Loaded: ' + d.sources.length + ' sources, ' + d.busses.length + ' busses, ' + d.sinks.length + ' sinks');
    })
    .catch(function(e) { setStatus('Error: ' + e.message); });
}

function rebuildEditor() {
  editor.clear();
  _nodeMap = {};
  _lvlFillCache.clear();
  _lvlSmooth = {};
  _lvlLastClip = {};

  // Extract saved node positions from layout (if available)
  // Keys are prefixed (src-/bus-/sink-) to avoid collisions when a source
  // and bus share the same id (e.g. "announce" source vs "announce" bus).
  var savedPositions = {};
  if (_state.layout) {
    try {
      var nodes = _state.layout.drawflow.Home.data;
      for (var nid in nodes) {
        var n = nodes[nid];
        var prefix = n.class.indexOf('source') >= 0 ? 'src-'
                   : n.class.indexOf('bus') >= 0 ? 'bus-'
                   : 'sink-';
        savedPositions[prefix + n.name] = {x: n.pos_x, y: n.pos_y};
      }
    } catch(e) {}
  }

  // Nodes with no saved position (new since the last Save) go BELOW the
  // saved ones in their column, not on top of them at the old fixed spots.
  var hasLayout = Object.keys(savedPositions).length > 0;
  var colStart = {'src-': {x: MARGIN_X, y: MARGIN_TOP}, 'bus-': {x: 350, y: MARGIN_TOP},
                  'sink-': {x: 680, y: MARGIN_TOP}};
  for (var key in savedPositions) {
    var pre = key.substring(0, key.indexOf('-') + 1), sp = savedPositions[key];
    if (!colStart[pre]) continue;
    if (!colStart[pre]._seen) { colStart[pre].x = sp.x; colStart[pre].y = sp.y; colStart[pre]._seen = true; }
    colStart[pre].y = Math.max(colStart[pre].y, sp.y + NODE_H_FALLBACK + GROUP_GAP);
  }
  function placeNew(pre) {
    var c = colStart[pre], p = {x: c.x, y: c.y};
    c.y += NODE_H_FALLBACK + GAP;
    return p;
  }
  // Retired sinks (an old gateway may still list 'nul') and their wires are
  // dropped here; the next Save removes them from the config for good.
  _state.sinks = (_state.sinks || []).filter(function(s) { return RETIRED_SINKS.indexOf(s.id) < 0; });
  _state.connections = (_state.connections || []).filter(function(c) {
    return !(c.type === 'bus-sink' && RETIRED_SINKS.indexOf(c.to) >= 0);
  });

  // Add source nodes (output only — right side)
  for (var i = 0; i < _state.sources.length; i++) {
    var s = _state.sources[i];
    var muted = s.muted ? ' muted' : '';
    var html = '<div class="box">'
      + '<div class="node-controls">'
      + '<button class="mute-btn' + muted + '" onclick="toggleMute(\'' + s.id + '\')" id="mute-' + s.id + '">M</button>'
      + '<input type="range" class="gain-slider" min="0" max="500" value="' + (s.gain || 100) + '" oninput="setGain(\'' + s.id + '\',this.value)" ondblclick="this.value=100;setGain(\'' + s.id + '\',100)" title="Gain (double-click to reset)">'
      + '<span class="gain-val" id="gain-val-' + s.id + '">' + (s.gain || 100) + '%</span>'
      + '</div>'
      + '<div class="level-bar" id="level-' + s.id + '"><div class="level-fill"></div></div>'
      + '</div>';
    var pos = savedPositions['src-' + s.id] || placeNew('src-');
    var srcCls = 'source' + (s.muted ? ' node-muted' : '');
    var nodeLabel = s.name + (s.port ? '<span class="node-port">:' + s.port + '</span>' : '');
    var nodeId = editor.addNode(s.id, 0, 1, pos.x, pos.y, srcCls, {id: s.id}, nodeLabel + '\n' + html);
    _nodeMap['src-' + s.id] = nodeId;
  }

  // Add bus nodes (input left, output right)
  for (var i = 0; i < _state.busses.length; i++) {
    var b = _state.busses[i];
    var cls = 'bus-' + b.type;
    var proc = b.processing || {};
    var busMuted = b.muted ? ' muted' : '';
    var html = '<div class="box"><div class="proc-buttons">'
      + '<button class="proc-btn' + (proc.hpf ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'hpf\')" id="proc-' + b.id + '-hpf" title="High Pass Filter">H</button>'
      + '<button class="proc-btn' + (proc.lpf ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'lpf\')" id="proc-' + b.id + '-lpf" title="Low Pass Filter">L</button>'
      + '<button class="proc-btn' + (proc.dfn ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'dfn\')" id="proc-' + b.id + '-dfn" title="Neural Denoise (DPDFNet 8 kHz)">D</button>'
      + '<button class="proc-btn' + (proc.agc ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'agc\')" id="proc-' + b.id + '-agc" title="Automatic Gain Control: levels quiet and loud stations, after denoise">A</button>'
      + '<button class="proc-btn' + (proc.comp ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'comp\')" id="proc-' + b.id + '-comp" title="Compressor: evens out loud and quiet syllables within an over, after the AGC">C</button>'
      + '<span class="proc-sep"></span>'
      + '<button class="proc-btn out-btn' + (proc.pcm === true ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'pcm\')" id="proc-' + b.id + '-pcm" title="Feed PCM stream">P</button>'
      + '<button class="proc-btn out-btn' + (proc.mp3 === true ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'mp3\')" id="proc-' + b.id + '-mp3" title="Feed MP3 stream">M</button>'
      + '<button class="proc-btn out-btn' + (proc.loop ? ' on' : '') + '" onclick="toggleProc(\'' + b.id + '\',\'loop\')" id="proc-' + b.id + '-loop" title="Loop record">R</button>'
      + '<span class="flex-spacer"></span>'
      + '<button class="mute-btn' + busMuted + '" onclick="toggleBusMute(\'' + b.id + '\')" id="bus-mute-' + b.id + '" title="Mute bus">M</button>'
      + '</div>'
      + (function() {
          var mix = (proc.dfn_mix !== undefined) ? proc.dfn_mix : 0.5;
          var pct = Math.round(mix * 100);
          var cls = 'dfn-mix-row' + (proc.dfn ? '' : ' dim-op');
          return '<div class="' + cls + '" id="dfn-mix-row-' + b.id + '">'
            + '<span class="dfn-mix-label">mix</span>'
            + '<input type="range" class="dfn-mix-slider" min="0" max="1" step="0.05" value="' + mix + '" '
            +   'id="dfn-mix-' + b.id + '" '
            +   'oninput="setDfnMix(\'' + b.id + '\', this.value, true)" '
            +   'onchange="setDfnMix(\'' + b.id + '\', this.value, false)" '
            +   'ondblclick="this.value=0.5;setDfnMix(\'' + b.id + '\', 0.5, false)">'
            + '<span class="dfn-mix-val" id="dfn-mix-val-' + b.id + '">' + pct + '%</span>'
            + '</div>';
        })()
      /* Delay lives in the title bar for solo busses — see the injection
         after node creation. As a body row it added ~14px that no other bus
         type had, so solo could never line up with the rest. */
      + '<div class="level-bar" id="level-bus_' + b.id + '"><div class="level-fill"></div></div>'
      + '</div>';
    var pos = savedPositions['bus-' + b.id] || placeNew('bus-');
    var busCls = cls + (b.muted ? ' node-muted' : '') + (proc.loop ? ' recording' : '');
    var nodeId = editor.addNode(b.id, 1, 1, pos.x, pos.y, busCls, {id: b.id, type: b.type}, '<span class="rec-dot" title="Loop recording"></span><span class="bus-name" data-bus="' + b.id + '" ondblclick="renameBus(this,\'' + b.id + '\')">' + b.name + '</span> <span class="bus-type-tag">(' + b.type + ')</span>\n' + html);
    _nodeMap['bus-' + b.id] = nodeId;
  }

  // Add sink nodes (input only — left side)
  for (var i = 0; i < _state.sinks.length; i++) {
    var s = _state.sinks[i];
    var muted = s.muted ? ' muted' : '';
    var html = '<div class="box">'
      + '<div class="node-controls">'
      + '<button class="mute-btn' + muted + '" onclick="toggleMute(\'' + s.id + '\')" id="mute-' + s.id + '">M</button>'
      + '<input type="range" class="gain-slider" min="0" max="500" value="' + (s.gain || 100) + '" oninput="setGain(\'' + s.id + '\',this.value)" ondblclick="this.value=100;setGain(\'' + s.id + '\',100)" title="Gain (double-click to reset)">'
      + '<span class="gain-val" id="gain-val-' + s.id + '">' + (s.gain || 100) + '%</span>'
      + '</div>'
      + '<div class="level-bar" id="level-' + s.id + '"><div class="level-fill"></div></div>';
    // Speaker mode selector — injected into title-box via JS after node creation
    if (s.id === 'speaker') {
      s._speaker_mode = (s.speaker_mode || 'virtual').toLowerCase();
    }
    html += '</div>';
    var pos = savedPositions['sink-' + s.id] || placeNew('sink-');
    var sinkCls = 'sink' + (s.muted ? ' node-muted' : '');
    var nodeId = editor.addNode(s.id, 1, 0, pos.x, pos.y, sinkCls, {id: s.id}, s.name + '\n' + html);
    _nodeMap['sink-' + s.id] = nodeId;
  }

  // Inject speaker mode buttons into title-box (top-right)
  var spkSink = _state.sinks.find(function(s) { return s.id === 'speaker'; });
  if (spkSink) {
    var spkNodeId = _nodeMap['sink-speaker'];
    if (spkNodeId) {
      // Was '.title-box', which does not exist — these buttons had never
      // rendered. .drawflow_content_node is the real container.
      var spkEl = document.querySelector('#node-' + spkNodeId + ' .drawflow_content_node');
      if (spkEl) {
        var sm = spkSink._speaker_mode || (spkSink.speaker_mode || 'virtual').toLowerCase();
        var wrap = document.createElement('span');
        wrap.className = 'title-delay';
        wrap.innerHTML = '<button class="proc-btn' + (sm === 'virtual' ? ' on' : '') + '" onclick="setSpeakerMode(\'virtual\')" id="spk-virtual" title="Virtual (metering only)">V</button>'
          + '<button class="proc-btn' + (sm === 'auto' ? ' on' : '') + '" onclick="setSpeakerMode(\'auto\')" id="spk-auto" title="Auto (try device, fallback virtual)">A</button>'
          + '<button class="proc-btn' + (sm === 'real' ? ' on' : '') + '" onclick="setSpeakerMode(\'real\')" id="spk-real" title="Real (require audio device)">R</button>';
        var spkBox = spkEl.querySelector('.box');
        if (spkBox) spkEl.insertBefore(wrap, spkBox); else spkEl.appendChild(wrap);
      }
    }
  }

  // Draw existing connections. addConnection() fires connectionCreated for
  // every restored edge, so suppress the validators: they exist to police
  // what the USER draws. Without this, opening the page on a config that
  // already has a conflict would silently delete an edge off the canvas,
  // and the next save would quietly persist that deletion.
  _restoringGraph = true;
  try {
  for (var i = 0; i < _state.connections.length; i++) {
    var c = _state.connections[i];
    if (c.type === 'source-bus') {
      var fromNode = _nodeMap['src-' + c.from];
      var toNode = _nodeMap['bus-' + c.to];
      if (fromNode && toNode) {
        try { editor.addConnection(fromNode, toNode, 'output_1', 'input_1'); } catch(e) {}
      }
    } else if (c.type === 'bus-sink') {
      var fromNode = _nodeMap['bus-' + c.from];
      var toNode = _nodeMap['sink-' + c.to];
      if (fromNode && toNode) {
        try { editor.addConnection(fromNode, toNode, 'output_1', 'input_1'); } catch(e) {}
      }
    }
  }
  } finally { _restoringGraph = false; }

  // First open (nothing saved yet): arrange instead of leaving a pile.
  // Otherwise just draw the bands/colours/stubs on the saved layout.
  // Next frame, so node heights are measured.
  requestAnimationFrame(function() {
    if (!hasLayout) { autoArrange(); setStatus('First open: auto-arranged — click Save to keep'); }
    else refreshDecor();
  });
}

// Add a new bus node
function addBusNode(type) {
  var name = prompt('Bus name:');
  if (!name) return;
  fetch('/routing/cmd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: 'add_bus', name: name, type: type})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) loadRouting();
      else alert('Error: ' + (d.error || 'unknown'));
    });
}

// Save current connections to backend
function saveRouting() {
  // Extract connections from Drawflow
  var data = editor.export();
  var connections = [];

  // Build reverse map: drawflow nodeId -> our id
  var reverseMap = {};
  for (var key in _nodeMap) {
    reverseMap[_nodeMap[key]] = key;
  }

  // Walk all nodes and their outputs
  var nodes = data.drawflow.Home.data;
  for (var nodeId in nodes) {
    var node = nodes[nodeId];
    var ourId = reverseMap[parseInt(nodeId)];
    if (!ourId) continue;

    var outputs = node.outputs;
    for (var outKey in outputs) {
      var conns = outputs[outKey].connections;
      for (var j = 0; j < conns.length; j++) {
        var targetNodeId = conns[j].node;
        var targetOurId = reverseMap[parseInt(targetNodeId)];
        if (!targetOurId) continue;

        if (ourId.startsWith('src-') && targetOurId.startsWith('bus-')) {
          connections.push({
            type: 'source-bus',
            from: ourId.substring(4),
            to: targetOurId.substring(4)
          });
        } else if (ourId.startsWith('bus-') && targetOurId.startsWith('sink-')) {
          connections.push({
            type: 'bus-sink',
            from: ourId.substring(4),
            to: targetOurId.substring(5)
          });
        }
      }
    }
  }

  // Also collect bus source/sink lists from connections
  var busUpdates = {};
  for (var i = 0; i < connections.length; i++) {
    var c = connections[i];
    if (c.type === 'source-bus') {
      if (!busUpdates[c.to]) busUpdates[c.to] = {sources: [], sinks: []};
      busUpdates[c.to].sources.push(c.from);
    } else if (c.type === 'bus-sink') {
      if (!busUpdates[c.from]) busUpdates[c.from] = {sources: [], sinks: []};
      busUpdates[c.from].sinks.push(c.to);
    }
  }

  // Save Drawflow layout (node positions)
  var layout = editor.export();

  // Send full state
  fetch('/routing/cmd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: 'save_all', connections: connections, bus_updates: busUpdates, layout: layout})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) setStatus('Saved!');
      else setStatus('Save error: ' + (d.error || 'unknown'));
    });
}

// Validate connections: only source→bus and bus→sink allowed
editor.on('connectionCreated', function(info) {
  if (_restoringGraph) return;   // restoring a saved graph, not a user action
  var fromNode = editor.drawflow.drawflow.Home.data[info.output_id];
  var toNode = editor.drawflow.drawflow.Home.data[info.input_id];
  if (!fromNode || !toNode) return;
  var fromClass = fromNode.class || '';
  var toClass = toNode.class || '';
  var fromIsBus = fromClass.indexOf('bus') >= 0;
  var toIsBus = toClass.indexOf('bus') >= 0;
  // Use whole-word match so sinks/sources that also carry modifier classes
  // (e.g. 'sink node-muted') still validate.
  var fromIsSource = (' ' + fromClass + ' ').indexOf(' source ') >= 0;
  var toIsSink = (' ' + toClass + ' ').indexOf(' sink ') >= 0;
  // Valid: source→bus or bus→sink
  var valid = (fromIsSource && toIsBus) || (fromIsBus && toIsSink);
  if (!valid) {
    setTimeout(function() {
      editor.removeSingleConnection(info.output_id, info.input_id, info.output_class, info.input_class);
    }, 0);
    var msg = fromIsSource && toIsSink ? 'Source must connect through a bus, not directly to a sink'
            : fromIsBus && toIsBus ? 'Cannot connect bus to bus'
            : toIsSource ? 'Cannot connect to a source input'
            : 'Invalid connection';
    setStatus(msg);
    return;
  }

  // One bus per sink. Two buses do NOT mix into a sink: queue sinks
  // interleave 50ms fragments of each and then start dropping, the
  // broadcastify L/R slots silently overwrite, and a *_tx sink ends up with
  // two PTT workers on one radio — when the first unkeys, the second keeps
  // transmitting into a radio that is no longer keyed. The server refuses
  // these too; this just stops the drag before it looks like it worked.
  if (fromIsBus && toIsSink) {
    // addNode() stores {id: s.id} as the node's data — the sink id itself.
    var sinkId = (toNode.data && toNode.data.id) || '';
    var feeders = busFeedersOf(toNode, info.input_class);
    if (feeders.length > 1) {
      setTimeout(function() {
        editor.removeSingleConnection(info.output_id, info.input_id, info.output_class, info.input_class);
      }, 0);
      var otherId = null;
      for (var fi = 0; fi < feeders.length; fi++) {
        if (feeders[fi] !== String(info.output_id)) { otherId = feeders[fi]; break; }
      }
      setStatus('"' + (sinkId || 'that sink') + '" is already fed by ' + busLabel(otherId) +
                ' — a sink takes one bus. Put both sources on one bus and let it mix them.');
    }
  }
});

// drawflow node id -> our 'bus-x' / 'sink-x' / 'src-x' id
function reverseNodeId(nodeId) {
  for (var key in _nodeMap) {
    if (String(_nodeMap[key]) === String(nodeId)) return key;
  }
  return null;
}

// Drawflow node ids of every BUS currently wired into this sink input,
// including the connection that just fired connectionCreated.
function busFeedersOf(sinkNode, inputClass) {
  var out = [];
  var inputs = (sinkNode && sinkNode.inputs) || {};
  var inp = inputs[inputClass] || inputs['input_1'];
  var conns = (inp && inp.connections) || [];
  for (var i = 0; i < conns.length; i++) {
    var id = String(conns[i].node);
    if (out.indexOf(id) < 0) out.push(id);
  }
  return out;
}

function busLabel(nodeId) {
  var ourId = nodeId ? reverseNodeId(nodeId) : null;
  if (!ourId) return 'another bus';
  var list = (_state && _state.busses) || [];
  var b = list.filter(function(x) { return 'bus-' + x.id === ourId; })[0];
  return '"' + ((b && (b.name || b.id)) || ourId.substring(4)) + '"';
}


// Handle node deletion
editor.on('nodeRemoved', function(nodeId) {
  var reverseMap = {};
  for (var key in _nodeMap) reverseMap[_nodeMap[key]] = key;
  var ourId = reverseMap[nodeId];
  if (ourId && ourId.startsWith('bus-')) {
    var busId = ourId.substring(4);
    fetch('/routing/cmd', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cmd: 'delete_bus', id: busId})
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) setStatus('Bus removed');
      });
  }
});

loadRouting();

// Mute toggle
function toggleMute(id) {
  fetch('/routing/cmd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: 'mute', id: id})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        var btn = document.getElementById('mute-' + id);
        if (btn) {
          if (d.muted) {
            btn.classList.add('muted');
          } else {
            btn.classList.remove('muted');
          }
          // Toggle red level bar on the parent node
          var node = btn.closest('.drawflow-node');
          if (node) {
            if (d.muted) { node.classList.add('node-muted'); }
            else { node.classList.remove('node-muted'); }
          }
        }
        setStatus(id + ': ' + (d.muted ? 'muted' : 'unmuted'));
      }
    });
}

// Bus mute toggle
function toggleBusMute(busId) {
  fetch('/routing/cmd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: 'bus_mute', bus: busId})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        var btn = document.getElementById('bus-mute-' + busId);
        if (btn) {
          if (d.muted) { btn.classList.add('muted'); }
          else { btn.classList.remove('muted'); }
          var node = btn.closest('.drawflow-node');
          if (node) {
            if (d.muted) { node.classList.add('node-muted'); }
            else { node.classList.remove('node-muted'); }
          }
        }
        setStatus(busId + ': ' + (d.muted ? 'muted' : 'unmuted'));
      }
    });
}

// Gain control
function setGain(id, value) {
  var label = document.getElementById('gain-val-' + id);
  if (label) label.textContent = value + '%';
  // Update slider DOM attribute so drawflow export captures it
  var slider = document.querySelector('.gain-slider[oninput*="' + id + '"]');
  if (slider) slider.setAttribute('value', value);
  // Update drawflow node's stored HTML so save persists the value
  var prefix = id.endsWith('_tx') || id === 'tnc_rx' ? 'sink-' : 'src-';
  // Try both prefixes since we may not know which type
  var dfId = _nodeMap[prefix + id] || _nodeMap['src-' + id] || _nodeMap['sink-' + id];
  if (dfId && editor) {
    try {
      var nodeEl = document.querySelector('#node-' + dfId + ' .drawflow_content_node');
      if (nodeEl) editor.drawflow.drawflow.Home.data[dfId].html = nodeEl.innerHTML;
    } catch(e) {}
  }
  // Debounce — only send after slider stops moving
  clearTimeout(setGain._timer);
  setGain._timer = setTimeout(function() {
    fetch('/routing/cmd', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cmd: 'gain', id: id, value: parseInt(value)})
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) setStatus(id + ': gain ' + value + '%');
      });
  }, 200);
}

// Bus rename — double-click bus name for inline edit
function renameBus(el, busId) {
  var current = el.textContent;
  var input = document.createElement('input');
  input.type = 'text';
  input.value = current;
  input.className = 'bus-rename-input';
  input.style.width = Math.max(80, current.length * 9) + 'px';
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
  function commit() {
    var newName = input.value.trim();
    if (!newName || newName === current) { el.textContent = current; return; }
    fetch('/routing/cmd', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cmd: 'rename_bus', id: busId, name: newName})
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        el.textContent = d.ok ? d.name : current;
        if (d.ok) setStatus('Renamed bus to: ' + d.name);
      }).catch(function() { el.textContent = current; });
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { el.textContent = current; }
  });
}

// Processing toggle
function toggleProc(busId, filter) {
  fetch('/routing/cmd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: 'toggle_proc', bus: busId, filter: filter})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        var btn = document.getElementById('proc-' + busId + '-' + filter);
        if (btn) {
          btn.classList.toggle('on', !!d.state);
          if (filter === 'loop') {
            var node = btn.closest('.drawflow-node');
            if (node) node.classList.toggle('recording', !!d.state);
          }
        }
        if (filter === 'pcm' || filter === 'mp3' || filter === 'loop') refreshDecor();
        if (filter === 'dfn') {
          var row = document.getElementById('dfn-mix-row-' + busId);
          if (row) row.classList.toggle('dim-op', !d.state);
        }
        setStatus(busId + ': ' + filter + ' ' + (d.state ? 'ON' : 'OFF'));
      }
    });
}

// DFN wet/dry mix slider (per-bus)
var _dfnMixTimers = {};
function setDfnMix(busId, value, isLive) {
  var mix = parseFloat(value);
  if (isNaN(mix)) return;
  mix = Math.max(0, Math.min(1, mix));
  var valEl = document.getElementById('dfn-mix-val-' + busId);
  if (valEl) valEl.textContent = Math.round(mix * 100) + '%';
  var send = function() {
    fetch('/routing/cmd', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cmd: 'set_dfn_mix', bus: busId, mix: mix})
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok && !isLive) {
          setStatus(busId + ': DFN mix ' + Math.round(mix * 100) + '%');
        }
      });
  };
  if (isLive) {
    if (_dfnMixTimers[busId]) clearTimeout(_dfnMixTimers[busId]);
    _dfnMixTimers[busId] = setTimeout(send, 80);
  } else {
    if (_dfnMixTimers[busId]) { clearTimeout(_dfnMixTimers[busId]); delete _dfnMixTimers[busId]; }
    send();
  }
}

// Speaker mode selector
function setSpeakerMode(mode) {
  fetch('/routing/cmd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: 'speaker_mode', mode: mode})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        ['virtual','auto','real'].forEach(function(m) {
          var b = document.getElementById('spk-' + m);
          if (b) { if (m === d.mode) b.classList.add('on'); else b.classList.remove('on'); }
        });
        setStatus('Speaker: ' + d.mode + (d.device ? ' (' + d.device + ')' : ''));
      } else {
        setStatus('Speaker mode error: ' + (d.error || 'unknown'));
      }
    });
}

// Poll audio levels and update bars
// Exponential smoothing: instant attack, fast decay so transients are
// visible and the meter doesn't lag. ~30 FPS poll + 0.35-per-sample fall =
// ~120 ms to drop 80% of peak.
var _lvlSmooth = {};
var _lvlLastClip = {}; // last written clip value per key (1% change threshold)
var _lvlFillCache = new Map(); // id -> .level-fill element

function _setLevel(fillEl, raw, key) {
  var prev = _lvlSmooth[key] || 0;
  var v = Math.min(Math.max(raw || 0, 0), 100);
  var rising = v > prev;
  var a = rising ? 1.0 : 0.35;
  var s = prev + (v - prev) * a;
  _lvlSmooth[key] = s;
  var lastClip = _lvlLastClip[key];
  // Sub-percent threshold: 0.25 ≈ ¼ px on an 80 px bar — below visible
  // resolution so we don't waste paint, but fine enough that the bar
  // doesn't quantize in 1 % steps.
  if (lastClip === undefined || Math.abs(s - lastClip) > 0.25) {
    _lvlLastClip[key] = s;
    fillEl.style.clipPath = 'inset(0 ' + (100 - s) + '% 0 0)';
  }
}

var _lvlPollBusy = false;
var _lvlLastRaf = 0;
var _LVL_INTERVAL = 33; // ~30fps

function _lvlRafLoop(ts) {
  requestAnimationFrame(_lvlRafLoop);
  if (ts - _lvlLastRaf < _LVL_INTERVAL) return;
  _lvlLastRaf = ts;
  if (_lvlPollBusy) return;
  _lvlPollBusy = true;
  fetch('/routing/levels')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var ptt = d._ptt || {};
      for (var id in d) {
        if (id === '_ptt') continue;
        var fill = _lvlFillCache.get(id);
        if (!fill) {
          var barEl = document.getElementById('level-' + id);
          if (barEl) { fill = barEl.querySelector('.level-fill'); if (fill) _lvlFillCache.set(id, fill); }
        }
        if (fill) _setLevel(fill, d[id], id);
      }
      for (var txId in ptt) {
        var lvl = document.getElementById('level-' + txId);
        if (lvl) {
          var dfNode = lvl.closest('.drawflow-node');
          if (dfNode) dfNode.classList.toggle('ptt-active', !!ptt[txId]);
        }
      }
      // Signal flow: a wire animates while what feeds it has level, and
      // gets thicker with that level (2 px idle → 5 px at full scale).
      // _wires comes from the LIVE graph (refreshDecor), so wires drawn
      // since the page loaded animate too.
      for (var j = 0; j < _wires.length; j++) {
        var w = _wires[j], lev = d[w.key] || 0;
        w.el.classList.toggle('flowing', lev > 3);
        var px = lev > 3 ? (2 + Math.min(lev, 100) * 0.03).toFixed(1) + 'px' : '';
        if (w.px !== px) { w.px = px; if (px) w.el.style.setProperty('--wire-w', px); else w.el.style.removeProperty('--wire-w'); }
      }
    })
    .catch(function() {})
    .finally(function() { _lvlPollBusy = false; });
}
requestAnimationFrame(_lvlRafLoop);
</script>
