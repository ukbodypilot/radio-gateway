<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Overview</title>
<link rel="stylesheet" href="/pages/common.css">
<link rel="stylesheet" href="/pages/dash.css">
</head>
<body>

<div id="toast-container" class="toast-stack"></div>

<!-- ═══ System vitals ═══ -->
<div class="panel" id="system-panel">
  <div class="panel-head"><h2 class="panel-title">System</h2></div>
  <div id="sysinfo">Loading...</div>
  <div class="trend-grid" id="trend-grid" aria-label="Trends, last hour"></div>
</div>

<!-- ═══ Gateway status flags ═══ -->
<div class="panel" id="gateway-panel">
  <div class="panel-head"><h2 class="panel-title">Gateway</h2></div>
  <div id="status">Loading...</div>
</div>

<!-- ═══ Annunciator — every subsystem, always visible. Dark lamp = off. ═══ -->
<div class="panel" id="subsys-panel">
  <div class="panel-head">
    <h2 class="panel-title">Subsystems</h2>
    <span class="panel-meta">click to open</span>
  </div>
  <div class="chip-grid">
    <a class="chip off" id="chip-link"   href="/dashboard/endpoints"><span class="chip-dot"></span><span class="chip-name">Link</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-work"   href="/dashboard/endpoints"><span class="chip-dot"></span><span class="chip-name">Workers</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-stream" href="/dashboard/services"><span class="chip-dot"></span><span class="chip-name">Stream</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-loop"   href="/dashboard/services"><span class="chip-dot"></span><span class="chip-name">Loop Rec</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-asl"    href="/dashboard/services"><span class="chip-dot"></span><span class="chip-name">AllStar</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-gps"    href="/dashboard/services"><span class="chip-dot"></span><span class="chip-name">GPS</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-adsb"   href="/dashboard/services"><span class="chip-dot"></span><span class="chip-name">ADS-B</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-usbip"  href="/dashboard/services"><span class="chip-dot"></span><span class="chip-name">USB/IP</span><span class="chip-val">--</span></a>
    <a class="chip off" id="chip-auto"   href="/dashboard/operate"><span class="chip-dot"></span><span class="chip-name">Automation</span><span class="chip-val">--</span></a>
  </div>
</div>

<!-- ═══ Activity — who was busy, and what was connected, over time ═══ -->
<div class="panel" id="activity-panel">
  <div class="panel-head">
    <h2 class="panel-title">Activity</h2>
    <span class="rgc-range" id="act-range" role="group" aria-label="Time window">
      <button type="button" data-h="1">1h</button><button type="button" data-h="6">6h</button><button type="button" data-h="24">24h</button>
    </span>
  </div>
  <div id="act-rows"><div class="empty"><span class="empty-hint">Loading history&hellip;</span></div></div>
  <div class="rgc-axis act-axis" id="act-axis"></div>
  <div class="act-legend">
    <span><i style="background:var(--t-accent)"></i>audio on the bus (brighter = louder)</span>
    <span><i style="background:var(--t-ok);opacity:.6"></i>connected</span>
    <span><i style="background:var(--t-err)"></i>down</span>
    <span><i style="background:#05080b;border:1px solid var(--t-border)"></i>no data</span>
  </div>
</div>

<script src="/pages/common.js"></script>
<script src="/pages/charts.js"></script>
<script src="/pages/dash.js"></script>
<script>
// ── Annunciator chip update ──
// state: 'ok' | 'warn' | 'err' | 'off'; live adds the heartbeat pulse.
function setChip(id, state, val, live) {
  var el = document.getElementById(id); if (!el) return;
  var cls = 'chip ' + state + (live ? ' live' : '');
  if (el.className !== cls) el.className = cls;
  // Remember when a lamp last changed colour (since this page was opened)
  // and say so on hover — a lamp that just went green reads differently
  // from one that has been green all day.
  if (el._state !== undefined && el._state !== state) el._changed = Date.now();
  el._state = state;
  var word = {ok: 'OK', warn: 'warning', err: 'fault', off: 'off'}[state] || state;
  el.title = el.querySelector('.chip-name').textContent + ': ' + word
           + (el._changed ? ' \u2014 changed at ' + RGC.fmtClock(el._changed, true) : ' \u2014 no change since this page was opened');
  setText(el.querySelector('.chip-val'), val);
}

// ── Gateway status flags + Link/Stream chips (2s) ──
var _lastStatusHTML = '';
createStatusPoller(function(s) {
  handleNotifications(s);

  var it=[];
  it.push(stItem('Mumble', stVal(s.mumble?'OK':'DOWN', (s.mumble?'green':'red')+flashCls('mumble',!!s.mumble))));
  it.push(stItem('PTT', stVal(s.ptt_active?'ON':'off', (s.ptt_active?'red':'green')+flashCls('ptt',!!s.ptt_active))
                 + ' <span class="st-label">('+s.ptt_method+')</span>'));
  if(s.sdr1_enabled&&s.sdr1_duck) it.push(stItem('Duck', stVal('ON','green')));
  it.push(stItem('Man PTT', stVal(s.manual_ptt?'ON':'off', (s.manual_ptt?'red':'green')+flashCls('manual_ptt',!!s.manual_ptt))));
  if(s.tx_talkback) it.push(stItem('TX Talkback', stVal('ON','yellow')));
  if(s.ms1_state) it.push(stItem('MS1', stVal(s.ms1_state==='running'?'ON':'OFF', (s.ms1_state==='running'?'green':s.ms1_state==='error'?'red':'white')+flashCls('ms1',s.ms1_state))));
  if(s.ms2_state) it.push(stItem('MS2', stVal(s.ms2_state==='running'?'ON':'OFF', (s.ms2_state==='running'?'green':s.ms2_state==='error'?'red':'white')+flashCls('ms2',s.ms2_state))));
  if(s.cat_enabled) it.push(stItem('CAT', stVal(s.cat==='active'||s.cat==='idle'?'ON':'OFF', (s.cat==='active'?'red':s.cat==='idle'?'green':'white')+flashCls('cat',s.cat))));
  if(s.d75_enabled){
    var _d75a=s.d75_mode==='bluetooth'?(s.d75_audio_connected?stVal('BT Audio','green'):stVal('No BT Audio','red'))
             :s.d75_mode==='link_endpoint'?stVal('Link','green'):stVal('USB','yellow');
    it.push(stItem('D75', stVal(s.d75_connected?'ON':'OFF', (s.d75_connected?'green':'red')+flashCls('d75_conn',!!s.d75_connected))+' '+_d75a));
  }
  if(s.relay_radio_enabled) it.push(stItem('PWRB', stVal(s.relay_pressing?'ON':'off', (s.relay_pressing?'red':'green')+flashCls('pwrb',!!s.relay_pressing))));
  for(var i=0;i<s.smart_countdowns.length;i++){var sc=s.smart_countdowns[i];it.push(stItem('Smart#'+sc.id, stVal(sc.remaining, sc.mode==='manual'?'cyan':'yellow')));}
  if(s.charger){var _chState=s.charger.startsWith("CHARGING");it.push(stItem('Charger', stVal(s.charger, (_chState?'green':'red')+flashCls('charger',_chState))));}
  if(s.cat_reliability&&s.cat_reliability.sent){var r=s.cat_reliability;it.push(stItem('CMD', stVal(r.sent,'green')+'/'+stVal(r.missed+' miss', r.missed>0?'red':'green')));}
  var h=stRow(it,'info-row');
  if (h !== _lastStatusHTML) { _lastStatusHTML = h; document.getElementById('status').innerHTML = h; }

  // Link chip
  if (s.link_enabled) {
    var n = (s.link_endpoints||[]).length;
    setChip('chip-link', n > 0 ? 'ok' : 'warn', n > 0 ? n + ' connected' : 'none');
  } else setChip('chip-link', 'off', 'off');

  // Stream chip
  if (s.streaming_enabled) {
    var ds = s.encoder_stats || {};
    var conn = ds.connected || s.stream_connected;
    setChip('chip-stream', conn ? 'ok' : 'err', conn ? 'LIVE' : 'DOWN', conn);
  } else setChip('chip-stream', 'off', 'off');
}, function() {
  document.getElementById('status').innerHTML =
    '<span class="red">Gateway offline — waiting for restart...</span>';
});

// ── Sysinfo (2s) ──
var _lastSysinfoHTML='';
createPoller('/sysinfo',2000,function(s){
  var h='<div class="st-row">';
  var crit=(s.cpu_critical_pct!==undefined)?s.cpu_critical_pct:s.cpu_pct;
  var bg=(s.cpu_background_pct!==undefined)?s.cpu_background_pct:0;
  h+='<div class="st-item"><span class="st-label">CPU:</span>'+sysBar(crit)+'</div>';
  h+='<div class="st-item"><span class="st-label">CPUBG:</span>'+sysBar(bg,'accent')+'</div>';
  if(s.cpu_iowait_pct!==undefined&&s.cpu_iowait_pct>5) h+='<div class="st-item"><span class="st-label">IOwait:</span><span class="st-val '+(s.cpu_iowait_pct>15?'red':'yellow')+'">'+s.cpu_iowait_pct+'%</span></div>';
  h+='<div class="st-item"><span class="st-label">RAM:</span>'+sysBar(s.mem_pct,'accent')+'</div>';
  if(s.swap_total_mb>0){var swPct=Math.round(100*s.swap_used_mb/s.swap_total_mb);h+='<div class="st-item"><span class="st-label">Swap:</span>'+sysBar(swPct,'warn')+'</div>';}
  h+='<div class="st-item"><span class="st-label">Disk:</span>'+sysBar(s.disk_pct,'warn')+'</div>';
  h+='<div class="st-item"><span class="st-label">Disk I/O:</span><span class="st-val green st-fixed" style="min-width:8ch">R:'+fmtBytes(s.disk_read_bps).replace('/s','')+'</span> <span class="st-val yellow st-fixed" style="min-width:8ch">W:'+fmtBytes(s.disk_write_bps).replace('/s','')+'</span></div>';
  h+='<div class="st-item"><span class="st-label">Net:</span><span class="st-val green st-fixed">R:'+fmtBytes(s.net_rx_bps).replace('/s','')+'</span> <span class="st-val cyan st-fixed">T:'+fmtBytes(s.net_tx_bps).replace('/s','')+'</span></div>';
  if(s.temps&&s.temps.length){var shownCore=false,shownAcpi=false;for(var i=0;i<s.temps.length;i++){var t=s.temps[i];var isCore=/core/i.test(t.label),isAcpi=/acpitz/i.test(t.label);if(isCore&&shownCore)continue;if(isAcpi&&shownAcpi)continue;if(!isCore&&!isAcpi)continue;if(isCore)shownCore=true;if(isAcpi)shownAcpi=true;var tc=t.temp>80?'red':t.temp>60?'yellow':'green';h+='<div class="st-item"><span class="st-label">'+t.label+':</span><span class="st-val '+tc+'">'+t.temp+'&deg;C</span></div>';}}
  if(s.ips&&s.ips.length){if(s.hostname)h+='<div class="st-item"><span class="st-label">Host:</span><span class="st-val white">'+s.hostname+'</span></div>';for(var i=0;i<s.ips.length;i++){var ifaceLabel=s.ips[i].iface==='tailscale0'?'TailScl':s.ips[i].iface;h+='<div class="st-item"><span class="st-label">'+ifaceLabel+':</span><span class="st-val white">'+s.ips[i].addr+'</span></div>';}if(s.ddns)h+='<div class="st-item"><span class="st-label">DDNS:</span><span class="st-val green">'+s.ddns+'</span></div>';if(s.tunnel_url)h+='<div class="st-item st-item-wide"><span class="st-label">CF:</span><span class="st-val green"><a href="'+s.tunnel_url+'" target="_blank" class="green">'+s.tunnel_url.replace('https://','').replace('.trycloudflare.com','')+'</a></span></div>';}
  if(s.uptime)h+='<div class="st-item"><span class="st-label">Uptime:</span><span class="st-val white">'+s.uptime+'</span></div>';
  h+='</div>';
  if(h!==_lastSysinfoHTML){_lastSysinfoHTML=h;document.getElementById('sysinfo').innerHTML=h;}
  trendFeed(s);
});

// ── Trend tiles ─────────────────────────────────────────────────────────────
// Each tile shows the last hour. History comes from Prometheus where the
// gateway records the metric; where it does not (yet), the tile draws what
// this page has seen since it was opened and says so in its tooltip.
function _kb(v){ return fmtBytes(v); }
var TRENDS = [
  {id:'cpu',  name:'CPU',       q:'100*(1-sum(rate(rg_host_cpu_seconds_total{mode="idle"}[2m]))/sum(rate(rg_host_cpu_seconds_total[2m])))',
   live:function(s){return s.cpu_pct;}, fmt:function(v){return v.toFixed(1)+'%';}, min:0, max:100},
  {id:'temp', name:'CPU temp',  q:'rg_cpu_temp_c', color:'var(--t-warn)',
   live:function(s){var t=s.temps||[];for(var i=0;i<t.length;i++)if(/core/i.test(t[i].label))return t[i].temp;return NaN;},
   fmt:function(v){return v.toFixed(0)+'\u00b0C';}, minSpan:10},
  {id:'ram',  name:'RAM',       q:'rg_host_mem_pct',
   live:function(s){return s.mem_pct;}, fmt:function(v){return v.toFixed(1)+'%';}, min:0, max:100},
  {id:'rx',   name:'Net down',  q:'rg_host_net_rx_bps', color:'var(--t-ok)',
   live:function(s){return s.net_rx_bps;}, fmt:_kb, min:0, minSpan:1024},
  {id:'tx',   name:'Net up',    q:'rg_host_net_tx_bps', color:'var(--t-ok)',
   live:function(s){return s.net_tx_bps;}, fmt:_kb, min:0, minSpan:1024},
  {id:'gwmem',name:'Gateway memory', q:'rg_process_resident_memory_bytes/1048576',
   live:function(){return NaN;}, fmt:function(v){return v.toFixed(0)+' MB';}, minSpan:50}
];
(function(){
  var g=document.getElementById('trend-grid'), h='';
  TRENDS.forEach(function(t){
    h+='<div class="trend" id="trend-'+t.id+'"><div class="trend-head"><span class="trend-name">'+t.name
      +'</span><span class="trend-val">--</span></div><div class="trend-spark"></div></div>';
    t.roll=RGC.rolling(1800); t.hist=null;
  });
  g.innerHTML=h;
})();
function trendDraw(t){
  var el=document.getElementById('trend-'+t.id), pts=t.hist||t.roll.points();
  el.title=t.hist?'Last hour':'Since this page was opened (no stored history for this yet)';
  RGC.spark(el.querySelector('.trend-spark'), pts, {fmt:t.fmt, color:t.color, min:t.min, max:t.max, minSpan:t.minSpan});
  var last=pts.length?pts[pts.length-1][1]:NaN;
  setText(el.querySelector('.trend-val'), isFinite(last)?t.fmt(last):'--');
}
function trendFeed(s){
  TRENDS.forEach(function(t){
    var v=t.live(s);
    t.roll.push(v);
    // Keep the newest sample current between history refreshes.
    if(t.hist&&isFinite(v)) t.hist[t.hist.length-1]=[Date.now(),v];
    trendDraw(t);
  });
}
function trendHistory(){
  var end=Date.now()/1000;
  TRENDS.forEach(function(t){
    RGC.prom(t.q,end-3600,end,30).then(function(res){
      t.hist=(res.length&&res[0].points.length>1)?res[0].points:null;
      trendDraw(t);
    });
  });
}
trendHistory(); setInterval(trendHistory,60000);

// ── Activity timeline ───────────────────────────────────────────────────────
// Audio rows come from the loop recorder's stored waveform (one row per
// recorded bus). Connection rows come from Prometheus (rg_link_endpoint_up
// per endpoint, `up` for the gateway process itself).
var ACT_BINS=240, _actHours=1, _actTimer=null, _actGen=0;
try{ var _ah=parseInt(localStorage.getItem('rg.actHours'),10); if(_ah===1||_ah===6||_ah===24)_actHours=_ah; }catch(e){}
function actPaintAudio(b){ return b>0?{color:'--t-accent',alpha:Math.min(1,0.3+b/70)}:null; }
function actPaintUp(b){ return b>=0.5?{color:'--t-ok',alpha:0.55}:{color:'--t-err',alpha:1}; }
function actLoad(){
  var gen=++_actGen, end=Date.now(), start=end-_actHours*3600000, binMs=(end-start)/ACT_BINS;
  document.querySelectorAll('#act-range button').forEach(function(b){ b.classList.toggle('on', parseInt(b.getAttribute('data-h'),10)===_actHours); });
  var audio=fetch('/loop/buses').then(function(r){return r.json();}).then(function(buses){
    return Promise.all((buses||[]).map(function(b){
      return fetch('/loop/waveform?bus='+encodeURIComponent(b.id)+'&start='+(start/1000)+'&end='+(end/1000))
        .then(function(r){return r.json();}).then(function(w){
          var bins=new Array(ACT_BINS), busy=0, total=0, res=(w.resolution||1)*1000, pk=w.peaks||[];
          for(var i=0;i<pk.length;i++){
            var t=w.start*1000+i*res, k=Math.floor((t-start)/binMs);
            if(k<0||k>=ACT_BINS) continue;
            if(bins[k]===undefined||pk[i]>bins[k]) bins[k]=pk[i];
            total++; if(pk[i]>0) busy++;
          }
          return {name:b.name||b.id, sub:b.freq?b.freq+' MHz':'', bins:bins, paint:actPaintAudio,
                  describe:function(v){return v>0?'audio, peak '+v+'%':'quiet';},
                  sum:total?(busy/total*100).toFixed(busy/total<0.1?1:0)+'% busy':'no data'};
        }).catch(function(){return null;});
    }));
  }).catch(function(){return [];});
  function upRows(q,nameOf){
    return RGC.prom(q,start/1000,end/1000,binMs/1000).then(function(res){
      return res.map(function(r){
        var bins=new Array(ACT_BINS), up=0, n=0;
        r.points.forEach(function(p){
          var k=Math.min(ACT_BINS-1,Math.max(0,Math.floor((p[0]-start)/binMs)));
          bins[k]=bins[k]===undefined?p[1]:Math.min(bins[k],p[1]);
        });
        for(var i=0;i<ACT_BINS;i++) if(bins[i]!==undefined){ n++; if(bins[i]>=0.5) up++; }
        return {name:nameOf(r.metric), sub:'', bins:bins, paint:actPaintUp,
                describe:function(v){return v>=0.5?'connected':'down';},
                sum:n?(up/n*100).toFixed(up===n?0:1)+'% up':'no data'};
      });
    });
  }
  Promise.all([audio, upRows('min_over_time(rg_link_endpoint_up['+Math.max(15,Math.round(binMs/1000))+'s])',function(m){return m.endpoint||'endpoint';}),
               upRows('min_over_time(up{job="radio-gateway"}['+Math.max(15,Math.round(binMs/1000))+'s])',function(){return 'Gateway';})])
  .then(function(r){
    if(gen!==_actGen) return;   // a newer window was picked meanwhile
    var groups=[['Audio',r[0].filter(Boolean)],['Connections',r[2].concat(r[1])]], box=document.getElementById('act-rows'), h='', rows=[];
    groups.forEach(function(g){
      if(!g[1].length) return;
      h+='<div class="act-group">'+g[0]+'</div>';
      g[1].forEach(function(row){
        h+='<div class="act-row"><span class="act-name" title="'+esc(row.name+(row.sub?' \u2014 '+row.sub:''))+'">'+esc(row.name)
          +'</span><span class="act-strip"></span><span class="act-sum">'+esc(row.sum)+'</span></div>';
        rows.push(row);
      });
    });
    if(!rows.length){ box.innerHTML='<div class="empty"><span class="empty-hint">No history available \u2014 needs the loop recorder or Prometheus</span></div>'; return; }
    box.innerHTML=h;
    box.querySelectorAll('.act-strip').forEach(function(el,i){
      RGC.strip(el,{start:start,end:end,bins:rows[i].bins,paint:rows[i].paint,describe:rows[i].describe});
    });
    RGC.timeAxis(document.getElementById('act-axis'),start,end);
  });
  clearTimeout(_actTimer);
  _actTimer=setTimeout(actLoad,_actHours===1?30000:_actHours===6?120000:300000);
}
document.getElementById('act-range').addEventListener('click',function(e){
  var h=parseInt(e.target.getAttribute('data-h'),10); if(!h) return;
  _actHours=h; try{localStorage.setItem('rg.actHours',String(h));}catch(x){}
  actLoad();
});
actLoad();

// ── Slow chips (10s): workers, loop, GPS, ADS-B, USB/IP, automation ──
// since=2100 → status only, skips the transcript payload we don't need here.
createPoller('/transcriptions?since=4102444800', 10000, function(d) {
  var st = d.status || {};
  if (!st.running) { setChip('chip-work', 'off', 'off'); return; }
  var workers = st.workers || [];
  var ready = workers.filter(function(w){ return w.model_loaded && (w.type !== 'remote' || w.reachable); }).length;
  var busy = (st.inflight || 0) > 0;
  setChip('chip-work',
    workers.length === 0 ? 'warn' : ready === workers.length ? 'ok' : ready > 0 ? 'warn' : 'err',
    ready + '/' + workers.length + ' ready', busy);
});
createPoller('/loop/buses', 10000, function(buses) {
  if (!buses || !buses.length) { setChip('chip-loop', 'off', 'off'); return; }
  var active = buses.filter(function(b){ return b.active; }).length;
  setChip('chip-loop', active > 0 ? 'ok' : 'warn', buses.length + (buses.length === 1 ? ' bus' : ' buses'));
});
createPoller('/gpsstatus', 10000, function(d) {
  if (!d.enabled) { setChip('chip-gps', 'off', 'off'); return; }
  if (!d.connected) setChip('chip-gps', 'err', 'no device');
  else if (d.fix > 0) setChip('chip-gps', 'ok', (d.satellites_used||0) + ' sats');
  else setChip('chip-gps', 'warn', 'no fix');
});
createPoller('/adsbstatus', 10000, function(d) {
  if (!d.enabled) { setChip('chip-adsb', 'off', 'off'); return; }
  setChip('chip-adsb', d.dump1090 ? 'ok' : 'err', d.dump1090 ? (d.aircraft + ' aircraft') : 'down');
});
createPoller('/usbipstatus', 15000, function(d) {
  if (!d.enabled) { setChip('chip-usbip', 'off', 'off'); return; }
  var n = (d.devices||[]).filter(function(x){ return x.attached; }).length;
  setChip('chip-usbip', d.server_reachable ? 'ok' : 'err', d.server_reachable ? n + ' attached' : 'unreachable');
});
createPoller('/automationstatus', 10000, function(a) {
  if (!a.enabled) { setChip('chip-auto', 'off', 'off'); return; }
  setChip('chip-auto', a.running ? 'ok' : 'err', a.running ? a.tasks.length + ' tasks' : 'stopped', !!a.current_task);
});
// AllStar node instances change rarely — 30s.
function _pollAsl() {
  fetch('/usrp/nodes').then(function(r){ return r.json(); }).then(function(insts) {
    var en = (insts||[]).filter(function(i){ return i.enabled; });
    if (!en.length) { setChip('chip-asl', 'off', 'off'); return; }
    setChip('chip-asl', 'ok', en.length + (en.length === 1 ? ' node' : ' nodes'));
  }).catch(function(){});
}
setInterval(_pollAsl, 30000); _pollAsl();
</script>

</body>
</html>
